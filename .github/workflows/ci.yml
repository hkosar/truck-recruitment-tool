# CI — Twisted Nail Carrier Recruiter
#
# Two independent jobs, one per npm package in the monorepo (app/, pipeline/).
# Runs on every push and every pull request. Deliberately references no
# secrets — lint/typecheck/build need none of the real Supabase/Google Maps/
# Socrata/Resend values (those are runtime/deploy-time concerns, wired in
# render.yaml instead).
#
# NOTE (M1.1 scaffolding): app/ and pipeline/ are being scaffolded by other
# workers in parallel with this file, so their package-lock.json files may
# not be committed yet the first several times this workflow runs. Both jobs
# tolerate that on purpose:
#   - Dependency caching uses actions/cache + hashFiles() rather than
#     setup-node's built-in `cache: npm` input. That built-in cache HARD
#     FAILS the step ("Dependencies lock file is not found") when the
#     lockfile doesn't exist yet. hashFiles() on a missing file just returns
#     an empty string, which costs a cache miss, never a failure.
#   - The install step falls back to `npm install` when package-lock.json is
#     absent, and uses `npm ci` (the reproducible, correct choice for CI)
#     once a lockfile has actually been committed.
# Once both packages have committed lockfiles this fallback always takes the
# `npm ci` branch; it can be deleted then, but costs nothing to leave.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  app:
    name: app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-app-${{ hashFiles('app/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-app-

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::warning::app/package-lock.json not found - falling back to 'npm install'. Commit a lockfile and this step will prefer 'npm ci' automatically."
            npm install
          fi

      - name: Lint
        run: npm run lint

      - name: Type check
        # npx (not a bare `tsc`) so this resolves app's local TypeScript
        # devDependency; a bare `tsc` isn't on PATH in a fresh Actions shell.
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      # The app unit and server tests (vitest, includes the loopback-fetch test). The real-database test files skip themselves when their database settings are absent, and none are set here; no secrets, no network.
      - name: Test
        run: npm test

  pipeline:
    name: pipeline
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-pipeline-${{ hashFiles('pipeline/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-pipeline-

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::warning::pipeline/package-lock.json not found - falling back to 'npm install'. Commit a lockfile and this step will prefer 'npm ci' automatically."
            npm install
          fi

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Offline, no dependencies: the first-manager bootstrap contract and the production SQL runner contract (guard statements, pinned file hashes and test wiring) and the secrets-wrapper tests.
      - name: First-manager contract and secrets wrapper (offline)
        working-directory: .
        run: |
          node scripts/verify-first-manager-contract.mjs
          node scripts/verify-prod-sql-runner-contract.mjs
          node --test scripts/run-with-secrets.test.mjs

  # The same pipeline checks on Node 24 as a separate job, so the existing "pipeline" check name (a possible required check) is unchanged.
  pipeline-node24:
    name: pipeline (Node 24)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-pipeline-node24-${{ hashFiles('pipeline/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-pipeline-node24-

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      # `npm run build` runs the pipeline tests first (npm test), then compiles.
      - name: Build
        run: npm run build

  # Repo-level offline checks that need no secrets and no network (only the pipeline packages are installed, for the script tests). Not run in app/ or pipeline/ because they read files across the whole repo.
  repo-checks:
    name: repo checks
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0: verify-cutover-runbook-contract.mjs reads two reviewed commits with `git show`, which a one-commit shallow clone does not have.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The script tests include scripts/pipeline-run-tests.test.mjs, which launches pipeline/node_modules/tsx, so this job needs the pipeline packages (same cache and install as the pipeline job). Still no secrets and no network use beyond the npm registry.
      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-pipeline-${{ hashFiles('pipeline/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-pipeline-

      - name: Install pipeline dependencies
        working-directory: pipeline
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::warning::pipeline/package-lock.json not found - falling back to 'npm install'. Commit a lockfile and this step will prefer 'npm ci' automatically."
            npm install
          fi

      # Every scripts/verify-*.mjs contract check (text-level checks of SQL, runbooks and source; none connects anywhere). bash -e stops at the first failure.
      - name: Contract checks (scripts/verify-*.mjs)
        run: |
          for f in scripts/verify-*.mjs; do
            echo "::group::$f"
            node "$f"
            echo "::endgroup::"
          done

      # All scripts/*.test.mjs unit tests (node's built-in runner). Run without NODE_OPTIONS set, because one test asserts the child process environment.
      - name: Script tests (scripts/*.test.mjs)
        run: node --test scripts/*.test.mjs