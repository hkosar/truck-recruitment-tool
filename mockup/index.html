/* ============================================================================
   Twisted Nail — Carrier Recruiter  ·  "Aggregate Dispatch Console"
   Design system: asphalt/concrete neutrals · burnt-orange accent · labeled
   semantic status chips · mono for data · light + dark, token-based.
   ============================================================================ */

:root {
  /* --- Neutrals: "concrete" (light), slight warm-grey bias, deliberately picked --- */
  --bg:            #eceae5;   /* room / behind surfaces */
  --surface:       #f7f6f3;   /* primary panels */
  --surface-2:     #fbfaf8;   /* raised / rows */
  --surface-sunk:  #e4e2dc;   /* wells, tracks */
  --border:        #d6d3cb;
  --border-strong: #bfbbb0;
  --text:          #22262b;   /* asphalt ink */
  --text-muted:    #5c6169;
  --text-subtle:   #8b8f96;

  /* --- Accent: burnt safety-orange (the dump-truck color) --- */
  --accent:        #e8611d;
  --accent-hover:  #cf5314;
  --accent-press:  #b8480f;
  --accent-ink:    #ffffff;   /* text on accent */
  --accent-tint:   #fbe7d8;   /* faint fill */
  --accent-tint-2: #f6d3ba;
  --accent-ring:   rgba(232, 97, 29, 0.38);

  /* --- Pipeline status (labeled, distinct from accent) --- */
  --st-new:        #64748b;  --st-new-tint:      #e7eaef;
  --st-attempted:  #b07d10;  --st-attempted-tint:#f6eccf;
  --st-contacted:  #2f6fed;  --st-contacted-tint:#dfe8fd;
  --st-interested: #157f43;  --st-interested-tint:#d6efdf;
  --st-notfit:     #8a8f98;  --st-notfit-tint:   #e8e8e6;
  --st-dnc:        #d0342c;  --st-dnc-tint:      #f8dcd9;

  /* --- Semantic (good/warn/crit/info) --- */
  --good: #157f43;  --warn: #b07d10;  --crit: #d0342c;  --info: #2f6fed;
  --good-tint:#d6efdf; --warn-tint:#f6eccf; --crit-tint:#f8dcd9; --info-tint:#dfe8fd;

  /* --- Form / geometry / motion --- */
  --radius:    6px;
  --radius-sm: 4px;
  --radius-lg: 10px;
  --shadow-1: 0 1px 2px rgba(24,26,29,.06), 0 1px 1px rgba(24,26,29,.04);
  --shadow-2: 0 4px 14px rgba(24,26,29,.10), 0 2px 4px rgba(24,26,29,.06);
  --shadow-pop: 0 12px 34px rgba(24,26,29,.20), 0 4px 10px rgba(24,26,29,.12);
  --map-land:  #dfe6e4;
  --map-land-2:#cfd8d6;
  --map-line:  #a7b2b0;

  --sidebar-w: 236px;
  --topbar-h:  56px;

  --font-ui: "Montserrat", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "SFMono-Regular", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;

  --ease: cubic-bezier(.4, 0, .2, 1);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg:            #0e1216;   /* asphalt */
    --surface:       #171c22;
    --surface-2:     #1e242b;
    --surface-sunk:  #0b0f13;
    --border:        #2b333c;
    --border-strong: #3a444f;
    --text:          #e7eaed;
    --text-muted:    #a3abb5;
    --text-subtle:   #6f7883;

    --accent:        #f26f2b;
    --accent-hover:  #f9813f;
    --accent-press:  #d95e1c;
    --accent-ink:    #1a0f07;
    --accent-tint:   #2c1a0f;
    --accent-tint-2: #3d2413;
    --accent-ring:   rgba(242, 111, 43, 0.45);

    --st-new:#93a0b2;        --st-new-tint:#232b34;
    --st-attempted:#d6a53a;  --st-attempted-tint:#33290f;
    --st-contacted:#6fa1ff;  --st-contacted-tint:#152439;
    --st-interested:#48bd77; --st-interested-tint:#122a1c;
    --st-notfit:#828a94;     --st-notfit-tint:#242a30;
    --st-dnc:#f2685f;        --st-dnc-tint:#361715;

    --good:#48bd77; --warn:#d6a53a; --crit:#f2685f; --info:#6fa1ff;
    --good-tint:#122a1c; --warn-tint:#33290f; --crit-tint:#361715; --info-tint:#152439;

    --shadow-1: 0 1px 2px rgba(0,0,0,.4);
    --shadow-2: 0 6px 18px rgba(0,0,0,.5);
    --shadow-pop: 0 16px 40px rgba(0,0,0,.6);
    --map-land:  #202a2d;
    --map-land-2:#2a373a;
    --map-line:  #3f4f52;
  }
}

/* Explicit theme overrides win over the media query in both directions */
:root[data-theme="light"] {
  --bg:#eceae5; --surface:#f7f6f3; --surface-2:#fbfaf8; --surface-sunk:#e4e2dc;
  --border:#d6d3cb; --border-strong:#bfbbb0; --text:#22262b; --text-muted:#5c6169; --text-subtle:#8b8f96;
  --accent:#e8611d; --accent-hover:#cf5314; --accent-press:#b8480f; --accent-ink:#ffffff;
  --accent-tint:#fbe7d8; --accent-tint-2:#f6d3ba; --accent-ring:rgba(232,97,29,.38);
  --st-new:#64748b; --st-new-tint:#e7eaef; --st-attempted:#b07d10; --st-attempted-tint:#f6eccf;
  --st-contacted:#2f6fed; --st-contacted-tint:#dfe8fd; --st-interested:#157f43; --st-interested-tint:#d6efdf;
  --st-notfit:#8a8f98; --st-notfit-tint:#e8e8e6; --st-dnc:#d0342c; --st-dnc-tint:#f8dcd9;
  --good:#157f43; --warn:#b07d10; --crit:#d0342c; --info:#2f6fed;
  --good-tint:#d6efdf; --warn-tint:#f6eccf; --crit-tint:#f8dcd9; --info-tint:#dfe8fd;
  --shadow-1:0 1px 2px rgba(24,26,29,.06),0 1px 1px rgba(24,26,29,.04);
  --shadow-2:0 4px 14px rgba(24,26,29,.10),0 2px 4px rgba(24,26,29,.06);
  --shadow-pop:0 12px 34px rgba(24,26,29,.20),0 4px 10px rgba(24,26,29,.12);
  --map-land:#dfe6e4; --map-land-2:#cfd8d6; --map-line:#a7b2b0;
}
:root[data-theme="dark"] {
  --bg:#0e1216; --surface:#171c22; --surface-2:#1e242b; --surface-sunk:#0b0f13;
  --border:#2b333c; --border-strong:#3a444f; --text:#e7eaed; --text-muted:#a3abb5; --text-subtle:#6f7883;
  --accent:#f26f2b; --accent-hover:#f9813f; --accent-press:#d95e1c; --accent-ink:#1a0f07;
  --accent-tint:#2c1a0f; --accent-tint-2:#3d2413; --accent-ring:rgba(242,111,43,.45);
  --st-new:#93a0b2; --st-new-tint:#232b34; --st-attempted:#d6a53a; --st-attempted-tint:#33290f;
  --st-contacted:#6fa1ff; --st-contacted-tint:#152439; --st-interested:#48bd77; --st-interested-tint:#122a1c;
  --st-notfit:#828a94; --st-notfit-tint:#242a30; --st-dnc:#f2685f; --st-dnc-tint:#361715;
  --good:#48bd77; --warn:#d6a53a; --crit:#f2685f; --info:#6fa1ff;
  --good-tint:#122a1c; --warn-tint:#33290f; --crit-tint:#361715; --info-tint:#152439;
  --shadow-1:0 1px 2px rgba(0,0,0,.4); --shadow-2:0 6px 18px rgba(0,0,0,.5); --shadow-pop:0 16px 40px rgba(0,0,0,.6);
  --map-land:#202a2d; --map-land-2:#2a373a; --map-line:#3f4f52;
}

/* --------------------------------- reset --------------------------------- */
*, *::before, *::after { box-sizing: border-box; }
* { margin: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font-ui);
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
#app { height: 100vh; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: none; }
a { color: inherit; text-decoration: none; }
svg { display: block; width: 16px; height: 16px; flex: none; }
.badge svg { width: 13px; height: 13px; }
.crumbs svg { width: 14px; height: 14px; }
.modal-head svg { width: 20px; height: 20px; color: var(--accent); }
::selection { background: var(--accent-tint-2); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.num  { font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--text-subtle); }
.muted { color: var(--text-muted); }
.subtle{ color: var(--text-subtle); }

/* --------------------------------- buttons --------------------------------- */
.btn {
  display: inline-flex; align-items: center; gap: 7px;
  height: 34px; padding: 0 14px;
  border-radius: var(--radius);
  border: 1px solid var(--border-strong);
  background: var(--surface-2);
  color: var(--text);
  font-size: 13px; font-weight: 600; white-space: nowrap;
  transition: background .12s var(--ease), border-color .12s var(--ease), transform .04s var(--ease);
}
.btn:hover { background: var(--surface-sunk); }
.btn:active { transform: translateY(1px); }
.btn svg { width: 15px; height: 15px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.primary:active { background: var(--accent-press); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--surface-sunk); }
.btn.danger { color: var(--crit); border-color: color-mix(in srgb, var(--crit) 40%, var(--border)); }
.btn.danger:hover { background: var(--crit-tint); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12px; border-radius: var(--radius-sm); }
.btn.lg { height: 40px; padding: 0 18px; font-size: 14px; }
.btn.block { width: 100%; justify-content: center; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.icon { padding: 0; width: 34px; justify-content: center; }
.btn.icon.sm { width: 28px; }

/* --------------------------------- inputs --------------------------------- */
.field { display: flex; flex-direction: column; gap: 6px; }
.label { font-size: 12px; font-weight: 600; color: var(--text-muted); }
.input, .select, .textarea {
  height: 36px; padding: 0 11px;
  background: var(--surface-2);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  color: var(--text); font-size: 13px; width: 100%;
  transition: border-color .12s var(--ease), box-shadow .12s var(--ease);
}
.textarea { height: auto; padding: 9px 11px; resize: vertical; min-height: 72px; line-height: 1.5; }
.input:focus, .select:focus, .textarea:focus {
  outline: none; border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-ring);
}
.input::placeholder, .textarea::placeholder { color: var(--text-subtle); }
.select { appearance: none; cursor: pointer;
  background-image: linear-gradient(45deg, transparent 50%, var(--text-muted) 50%), linear-gradient(135deg, var(--text-muted) 50%, transparent 50%);
  background-position: right 14px center, right 9px center; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
  padding-right: 28px;
}
.input-group { position: relative; display: flex; align-items: center; }
.input-group svg { position: absolute; left: 10px; width: 15px; height: 15px; color: var(--text-subtle); pointer-events: none; }
.input-group .input { padding-left: 32px; }

.check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; font-size: 13px; }
.check input { position: absolute; opacity: 0; width: 0; height: 0; }
.check .box {
  width: 17px; height: 17px; border-radius: 4px; border: 1.5px solid var(--border-strong);
  background: var(--surface-2); display: grid; place-items: center; flex: none; transition: all .12s var(--ease);
}
.check .box svg { width: 12px; height: 12px; color: var(--accent-ink); opacity: 0; transform: scale(.6); transition: all .12s var(--ease); }
.check input:checked + .box { background: var(--accent); border-color: var(--accent); }
.check input:checked + .box svg { opacity: 1; transform: scale(1); }
.check input:focus-visible + .box { box-shadow: 0 0 0 3px var(--accent-ring); }

/* toggle switch */
.switch { position: relative; display: inline-flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
.switch input { position: absolute; opacity: 0; }
.switch .track { width: 38px; height: 22px; border-radius: 999px; background: var(--surface-sunk); border: 1px solid var(--border-strong); transition: all .15s var(--ease); flex: none; }
.switch .track::after { content:""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--text-subtle); transition: all .15s var(--ease); }
.switch input:checked + .track { background: var(--accent); border-color: var(--accent); }
.switch input:checked + .track::after { left: 19px; background: #fff; }
.switch input:focus-visible + .track { box-shadow: 0 0 0 3px var(--accent-ring); }
.switch.danger input:checked + .track { background: var(--crit); border-color: var(--crit); }

/* range */
input[type=range] { -webkit-appearance: none; appearance: none; height: 6px; border-radius: 999px; background: var(--surface-sunk); border: 1px solid var(--border); width: 100%; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); border: 2px solid var(--surface-2); box-shadow: var(--shadow-1); cursor: pointer; }
input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--accent); border: 2px solid var(--surface-2); cursor: pointer; }

/* segmented control */
.seg { display: inline-flex; padding: 3px; gap: 3px; background: var(--surface-sunk); border: 1px solid var(--border); border-radius: var(--radius); }
.seg button { height: 28px; padding: 0 12px; border-radius: var(--radius-sm); font-size: 12px; font-weight: 600; color: var(--text-muted); display: inline-flex; align-items: center; gap: 6px; transition: all .12s var(--ease); }
.seg button svg { width: 14px; height: 14px; }
.seg button.on { background: var(--surface-2); color: var(--text); box-shadow: var(--shadow-1); }
.seg button:not(.on):hover { color: var(--text); }

/* chips (filter terms) */
.chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 6px 0 10px; border-radius: 999px; background: var(--accent-tint); color: var(--accent-press); border: 1px solid var(--accent-tint-2); font-size: 12px; font-weight: 600; }
.chip button { display: grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; color: inherit; opacity: .7; }
.chip button:hover { opacity: 1; background: rgba(0,0,0,.08); }
.chip.flag { background: var(--surface-sunk); color: var(--text-muted); border-color: var(--border); }

/* --------------------------------- status badge --------------------------------- */
.badge { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px; border-radius: 999px; font-size: 11.5px; font-weight: 700; letter-spacing: .01em; white-space: nowrap; }
.badge .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
.badge.new{color:var(--st-new);background:var(--st-new-tint);}
.badge.attempted{color:var(--st-attempted);background:var(--st-attempted-tint);}
.badge.contacted{color:var(--st-contacted);background:var(--st-contacted-tint);}
.badge.interested{color:var(--st-interested);background:var(--st-interested-tint);}
.badge.not_a_fit{color:var(--st-notfit);background:var(--st-notfit-tint);}
.badge.dnc{color:var(--st-dnc);background:var(--st-dnc-tint);}
.badge.tier1{color:var(--accent-press);background:var(--accent-tint);}
.badge.tier2{color:var(--st-new);background:var(--st-new-tint);}
.badge.plain{color:var(--text-muted);background:var(--surface-sunk);}
.badge.good{color:var(--good);background:var(--good-tint);}
.badge.warn{color:var(--warn);background:var(--warn-tint);}
.badge.crit{color:var(--crit);background:var(--crit-tint);}
.badge.info{color:var(--info);background:var(--info-tint);}

/* --------------------------------- cards --------------------------------- */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-1); }

/* --------------------------------- app shell --------------------------------- */
.shell { display: grid; grid-template-columns: var(--sidebar-w) 1fr; height: 100vh; }
.sidebar { background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
.brand { display: flex; align-items: center; gap: 10px; height: var(--topbar-h); padding: 0 16px; border-bottom: 1px solid var(--border); }
.brand .mark { width: 30px; height: 30px; border-radius: 7px; background: var(--accent); display: grid; place-items: center; flex: none; box-shadow: var(--shadow-1); }
.brand .mark svg { width: 18px; height: 18px; color: var(--accent-ink); }
.brand .name { font-weight: 800; letter-spacing: -.01em; font-size: 15px; line-height: 1; }
.brand .sub { font-size: 10px; font-weight: 700; letter-spacing: .13em; color: var(--text-subtle); text-transform: uppercase; margin-top: 3px; }
.nav { padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; flex: 1; }
.nav-label { padding: 12px 10px 5px; }
.nav a { display: flex; align-items: center; gap: 11px; padding: 8px 10px; border-radius: var(--radius); color: var(--text-muted); font-weight: 600; font-size: 13px; transition: background .12s var(--ease), color .12s var(--ease); }
.nav a svg { width: 17px; height: 17px; flex: none; }
.nav a:hover { background: var(--surface-sunk); color: var(--text); }
.nav a.on { background: var(--accent-tint); color: var(--accent-press); }
.nav a .count { margin-left: auto; font-size: 11px; font-weight: 700; color: var(--text-subtle); background: var(--surface-sunk); padding: 1px 7px; border-radius: 999px; }
.nav a.on .count { background: var(--accent-tint-2); color: var(--accent-press); }
.side-foot { border-top: 1px solid var(--border); padding: 10px; }

.usercell { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: var(--radius); width: 100%; }
.usercell:hover { background: var(--surface-sunk); }
.avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #fff; flex: none; }
.usercell .who { text-align: left; min-width: 0; }
.usercell .who .nm { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.usercell .who .rl { font-size: 11px; color: var(--text-subtle); }

/* main column */
.main { display: flex; flex-direction: column; min-width: 0; height: 100vh; }
.topbar { height: var(--topbar-h); border-bottom: 1px solid var(--border); background: color-mix(in srgb, var(--surface) 82%, transparent); backdrop-filter: blur(6px); display: flex; align-items: center; gap: 14px; padding: 0 20px; flex: none; }
.topbar .crumbs { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-muted); min-width: 0; }
.topbar .crumbs .cur { color: var(--text); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .spacer { flex: 1; }
.content { flex: 1; overflow-y: auto; overflow-x: hidden; }
.page { max-width: 1240px; margin: 0 auto; padding: 22px 24px 60px; }
.page.wide { max-width: none; }

.page-head { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 20px; }
.page-head .h1 { font-size: 21px; font-weight: 800; letter-spacing: -.02em; }
.page-head .desc { color: var(--text-muted); font-size: 13px; margin-top: 3px; max-width: 60ch; }
.page-head .spacer { flex: 1; }

/* --------------------------------- tables --------------------------------- */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl thead th { position: sticky; top: 0; z-index: 2; background: var(--surface); text-align: left; font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--text-subtle); padding: 10px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.tbl tbody td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.tbl tbody tr { transition: background .1s var(--ease); }
.tbl tbody tr:hover { background: var(--surface-2); }
.tbl tbody tr:last-child td { border-bottom: none; }
.tbl tbody tr.sel { background: var(--accent-tint); }
.tbl tbody tr.sel:hover { background: var(--accent-tint); }
.tbl tbody tr.dnc { opacity: .62; }
.tbl tbody tr.clickable { cursor: pointer; }
.tbl .co { display: flex; flex-direction: column; gap: 1px; }
.tbl .co .nm { font-weight: 700; }
.tbl .co .meta { font-size: 11.5px; color: var(--text-subtle); }
td.right, th.right { text-align: right; }
.row-flash { animation: flash 1.4s var(--ease); }
@keyframes flash { 0% { background: var(--accent-tint-2); } 100% { background: transparent; } }

/* --------------------------------- tabs --------------------------------- */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); }
.tabs button { padding: 10px 14px; font-size: 13px; font-weight: 600; color: var(--text-muted); border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color .12s var(--ease); }
.tabs button:hover { color: var(--text); }
.tabs button.on { color: var(--accent-press); border-bottom-color: var(--accent); }

/* --------------------------------- map --------------------------------- */
.map { position: relative; background: linear-gradient(160deg, var(--surface-2), var(--surface-sunk)); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
.map svg { width: 100%; height: 100%; display: block; }
.map .tx-land { fill: var(--map-land); stroke: var(--map-line); stroke-width: 1.2; stroke-linejoin: round; }
.map .city-dot { fill: var(--text-subtle); }
.map .city-lbl { fill: var(--text-muted); font-size: 9px; font-weight: 600; font-family: var(--font-ui); }
.map .pin { transition: r .2s var(--ease), opacity .2s var(--ease); cursor: pointer; }
.map .pin.match { fill: var(--accent); }
.map .pin.dim { fill: var(--map-line); opacity: .4; }
.map .radius-fill { fill: var(--accent); opacity: .1; stroke: var(--accent); stroke-width: 1.4; stroke-dasharray: 5 4; }
.map .corridor-band { fill: none; stroke: var(--accent); opacity: .22; stroke-linecap: round; stroke-linejoin: round; }
.map .corridor-line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-dasharray: 6 5; }
.map .anchor { fill: var(--accent); stroke: #fff; stroke-width: 2; }
.map-legend { position: absolute; left: 12px; bottom: 12px; background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: blur(4px); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 10px; font-size: 11px; display: flex; flex-direction: column; gap: 5px; box-shadow: var(--shadow-1); }
.map-legend .lg { display: flex; align-items: center; gap: 7px; color: var(--text-muted); }
.map-legend .sw { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.map-count { position: absolute; right: 12px; top: 12px; background: color-mix(in srgb, var(--surface) 90%, transparent); backdrop-filter: blur(4px); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 12px; box-shadow: var(--shadow-1); text-align: right; }
.map-count b { font-size: 20px; font-weight: 800; font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--accent-press); }
.map-count span { display: block; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-subtle); }

/* --------------------------------- misc layout --------------------------------- */
.stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 14px 16px; }
.stat .k { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-subtle); }
.stat .v { font-size: 26px; font-weight: 800; font-family: var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -.02em; margin-top: 4px; }
.stat .v small { font-size: 13px; color: var(--text-subtle); font-weight: 600; }

.progress { display: flex; height: 8px; border-radius: 999px; overflow: hidden; background: var(--surface-sunk); }
.progress i { display: block; height: 100%; }

.divider { height: 1px; background: var(--border); border: none; }
.mem-row { width: 100%; padding: 8px; border-radius: 6px; text-align: left; }
.mem-row:hover { background: var(--surface-sunk); }

.kv { display: grid; grid-template-columns: 128px 1fr; gap: 4px 14px; font-size: 13px; }
.kv dt { color: var(--text-subtle); font-size: 12px; }
.kv dd { color: var(--text); }

.empty { text-align: center; padding: 48px 20px; color: var(--text-subtle); }
.empty svg { width: 34px; height: 34px; margin: 0 auto 10px; opacity: .5; }

/* --------------------------------- modal / toast / menu --------------------------------- */
.scrim { position: fixed; inset: 0; background: rgba(10,12,14,.5); backdrop-filter: blur(2px); display: grid; place-items: center; z-index: 60; padding: 20px; animation: fade .15s var(--ease); }
.modal { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-pop); width: 100%; max-width: 460px; animation: pop .18s var(--ease); }
.modal.lg { max-width: 720px; }
.modal-head { padding: 16px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
.modal-head .t { font-weight: 800; font-size: 16px; }
.modal-body { padding: 18px; max-height: 68vh; overflow-y: auto; }
.modal-foot { padding: 14px 18px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: flex-end; }
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

.menu { position: absolute; z-index: 70; background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius); box-shadow: var(--shadow-pop); padding: 5px; min-width: 180px; animation: pop .12s var(--ease); }
.menu button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; text-align: left; color: var(--text); }
.menu button svg { width: 15px; height: 15px; color: var(--text-subtle); }
.menu button:hover { background: var(--surface-sunk); }
.menu button.danger { color: var(--crit); }
.menu button.danger svg { color: var(--crit); }
.menu .sep { height: 1px; background: var(--border); margin: 5px 0; }

.toast-wrap { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 90; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.toast { display: flex; align-items: center; gap: 10px; background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 13px; font-weight: 600; box-shadow: var(--shadow-pop); animation: pop .18s var(--ease); }
.toast svg { width: 16px; height: 16px; color: var(--accent); }

/* --------------------------------- auth --------------------------------- */
.auth { min-height: 100vh; display: grid; grid-template-columns: 1fr; place-items: center; padding: 24px; position: relative; overflow: hidden; }
.auth::before { content: ""; position: absolute; inset: 0; background:
  radial-gradient(1100px 500px at 80% -10%, var(--accent-tint), transparent 60%),
  repeating-linear-gradient(135deg, transparent 0 22px, color-mix(in srgb, var(--border) 40%, transparent) 22px 23px);
  opacity: .7; z-index: 0; }
.auth-card { position: relative; z-index: 1; width: 100%; max-width: 400px; }
.auth-brand { display: flex; align-items: center; gap: 12px; justify-content: center; margin-bottom: 22px; }
.auth-brand .mark { width: 40px; height: 40px; border-radius: 9px; background: var(--accent); display: grid; place-items: center; box-shadow: var(--shadow-2); }
.auth-brand .mark svg { width: 24px; height: 24px; color: var(--accent-ink); }
.auth-brand .name { font-size: 19px; font-weight: 800; letter-spacing: -.02em; }
.auth-brand .sub { font-size: 10px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--text-subtle); }
.auth-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-2); padding: 26px; }
.auth-panel h1 { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
.auth-panel .lead { color: var(--text-muted); font-size: 13px; margin-bottom: 20px; }
.auth-row { display: flex; align-items: center; justify-content: space-between; }
.link { color: var(--accent-press); font-weight: 600; font-size: 13px; }
.link:hover { text-decoration: underline; }
.auth-foot { text-align: center; margin-top: 18px; font-size: 13px; color: var(--text-muted); }
.demo-note { margin-top: 16px; padding: 11px 13px; border: 1px dashed var(--border-strong); border-radius: var(--radius); font-size: 12px; color: var(--text-muted); background: var(--surface-2); }
.demo-note b { color: var(--text); }

/* utility spacing */
.stack { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; }
.gap-4{gap:4px}.gap-6{gap:6px}.gap-8{gap:8px}.gap-10{gap:10px}.gap-12{gap:12px}.gap-16{gap:16px}.gap-20{gap:20px}.gap-24{gap:24px}
.mt-4{margin-top:4px}.mt-8{margin-top:8px}.mt-12{margin-top:12px}.mt-16{margin-top:16px}.mt-20{margin-top:20px}.mt-24{margin-top:24px}
.wrap{flex-wrap:wrap}.center{align-items:center}.between{justify-content:space-between}.end{justify-content:flex-end}.col{flex-direction:column}
.grow{flex:1}.none{flex:none}
.hide { display: none !important; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}

@media (max-width: 900px) {
  :root { --sidebar-w: 0px; }
  .sidebar { display: none; }
  .shell { grid-template-columns: 1fr; }
}
/* ============================================================================
   _components.css — v2 components layered on the base design system.
   ============================================================================ */

/* brand mark: nail on orange */
.brand .mark svg { color: var(--accent-ink); width: 18px; height: 18px; }
.auth-brand .mark svg { color: var(--accent-ink); }

/* reserved (disabled) future-tool nav (F2) */
.nav .nav-label.reserved { margin-top: 14px; }
.nav a.reserved { opacity: .55; cursor: default; }
.nav a.reserved:hover { background: transparent; color: var(--text-muted); }
.nav a.reserved .soon { margin-left: auto; font-size: 8.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--text-subtle); background: var(--surface-sunk); padding: 2px 6px; border-radius: 999px; }

/* ---- warning system (F15 / G5) — pale-red rows + reason chips everywhere ---- */
tr.warn-row > td { background: var(--crit-tint); }
tr.warn-row:hover > td { background: color-mix(in srgb, var(--crit-tint) 82%, var(--surface-2)); }
.wchips { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.wchip { display: inline-flex; align-items: center; gap: 4px; height: 19px; padding: 0 7px; border-radius: 999px; font-size: 10.5px; font-weight: 700; white-space: nowrap; }
.wchip svg { width: 11px; height: 11px; }
.wchip.crit { color: var(--crit); background: var(--crit-tint); }
.wchip.warn { color: var(--warn); background: var(--warn-tint); }
.warn-flag { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; color: var(--crit); }
.warn-flag svg { width: 14px; height: 14px; }

/* ---- stat strip (F24 kinship) ---- */
.strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(116px, 1fr)); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
.strip .cell { background: var(--surface); padding: 11px 15px; }
.strip .cell .k { font-size: 10px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--text-subtle); }
.strip .cell .v { font-size: 21px; font-weight: 800; font-family: var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -.02em; margin-top: 3px; }
.strip .cell.accent .v { color: var(--accent-press); }
.strip .cell.crit .v { color: var(--crit); }
.strip .cell.good .v { color: var(--st-interested); }

/* ---- stepper (wizard) ---- */
.stepper { display: flex; align-items: center; gap: 6px; }
.stepper .step { display: flex; align-items: center; gap: 8px; }
.stepper .num { width: 25px; height: 25px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 800; background: var(--surface-sunk); color: var(--text-subtle); border: 1px solid var(--border-strong); }
.stepper .num svg { width: 13px; height: 13px; }
.stepper .step.on .num { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.stepper .step.done .num { background: var(--st-interested); color: #fff; border-color: var(--st-interested); }
.stepper .lbl { font-size: 12.5px; font-weight: 600; color: var(--text-muted); }
.stepper .step.on .lbl { color: var(--text); font-weight: 700; }
.stepper .bar { width: 26px; height: 2px; background: var(--border-strong); border-radius: 2px; }

.wizard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; }
.wizard-map { position: sticky; top: 16px; }
.wizfoot { position: fixed; left: var(--sidebar-w); right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--border); box-shadow: 0 -4px 14px rgba(0,0,0,.08); padding: 12px 24px; display: flex; align-items: center; gap: 16px; z-index: 25; }
.wizcount { font-size: 13px; color: var(--text-muted); }
.wizcount b { font-family: var(--font-mono); font-weight: 800; color: var(--accent-press); font-size: 18px; }
.subcount { display: inline-flex; gap: 10px; font-size: 11px; color: var(--text-subtle); }

/* ---- lane cards (multi-lane, F21) ---- */
.lane { display: flex; gap: 11px; align-items: flex-start; padding: 11px 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
.lane + .lane { margin-top: 8px; }
.lane .idx { width: 24px; height: 24px; border-radius: 7px; background: var(--accent-tint); color: var(--accent-press); display: grid; place-items: center; font-weight: 800; font-size: 12px; flex: none; }
.lane .lmeta { min-width: 0; flex: 1; }
.lane .lmeta .lmat { font-weight: 700; font-size: 13px; }
.lane .lmeta .lgeo { font-size: 11.5px; color: var(--text-subtle); margin-top: 1px; }
.lane-editor { border: 1px dashed var(--border-strong); border-radius: var(--radius); padding: 14px; background: var(--surface-2); }

/* ---- facet browser (F14 / G8) ---- */
.facet-list { max-height: 300px; overflow-y: auto; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
.facet-row { display: flex; align-items: center; gap: 10px; padding: 7px 11px; border-bottom: 1px solid var(--border); font-size: 13px; }
.facet-row:last-child { border-bottom: none; }
.facet-row .fval { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.facet-row .cnt { margin-left: auto; font-family: var(--font-mono); font-size: 12px; color: var(--text-subtle); font-variant-numeric: tabular-nums; }
.facet-row.inc { background: color-mix(in srgb, var(--st-interested-tint) 60%, var(--surface)); }
.facet-row.exc { background: color-mix(in srgb, var(--crit-tint) 55%, var(--surface)); opacity: .8; }
.tri { display: inline-flex; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); overflow: hidden; flex: none; }
.tri button { width: 30px; height: 24px; display: grid; place-items: center; font-size: 11px; font-weight: 700; color: var(--text-subtle); background: var(--surface-2); }
.tri button + button { border-left: 1px solid var(--border-strong); }
.tri button svg { width: 13px; height: 13px; }
.tri button.inc.on { background: var(--st-interested); color: #fff; }
.tri button.exc.on { background: var(--crit); color: #fff; }
.sugbar { display: flex; flex-wrap: wrap; gap: 6px; }
.sugbar .chip { cursor: pointer; }
.sugbar .chip .cnt { font-family: var(--font-mono); opacity: .7; }
.facet-sum { display: flex; gap: 14px; align-items: center; padding: 9px 12px; background: var(--surface-sunk); border: 1px solid var(--border); border-radius: var(--radius); font-size: 12.5px; font-weight: 600; }
.cargo-flags { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 16px; max-height: 250px; overflow-y: auto; padding-right: 6px; }
.flag-row { display: flex; align-items: center; gap: 8px; padding: 4px 2px; font-size: 12.5px; }
.flag-row .cnt { margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--text-subtle); }

/* ---- activity feed (F11 / G7) ---- */
.feed { display: flex; flex-direction: column; }
.feed-item { display: flex; gap: 11px; padding: 11px 0; border-top: 1px solid var(--border); }
.feed-item:first-child { border-top: none; }
.feed-ic { width: 27px; height: 27px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--surface-sunk); color: var(--text-subtle); }
.feed-ic svg { width: 14px; height: 14px; }
.feed-ic.comment { background: var(--accent-tint); color: var(--accent-press); }
.feed-body { min-width: 0; flex: 1; font-size: 13px; }
.feed-body .fmeta { font-size: 11px; color: var(--text-subtle); margin-top: 2px; }
.feed-body .fcomment { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 10px; margin-top: 3px; }
.composer { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 4px; }

/* ---- verification tiles (F7) ---- */
.vtiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.vtile { border: 1px solid var(--border); border-left: 3px solid var(--border-strong); border-radius: var(--radius-lg); padding: 15px; background: var(--surface); }
.vtile.good { border-left-color: var(--st-interested); }
.vtile.warn { border-left-color: var(--warn); }
.vtile.crit { border-left-color: var(--crit); }
.vtile .vhead { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.vtile .vhead .vic { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; }
.vtile .vhead .vic svg { width: 14px; height: 14px; }
.vtile.good .vic { background: var(--good-tint); color: var(--good); }
.vtile.warn .vic { background: var(--warn-tint); color: var(--warn); }
.vtile.crit .vic { background: var(--crit-tint); color: var(--crit); }
.vtile.plain .vic { background: var(--surface-sunk); color: var(--text-subtle); }
.vtile .vname { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--text-subtle); }
.vtile .vbig { font-size: 19px; font-weight: 800; letter-spacing: -.01em; }
.vtile .vsub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

/* ---- carrier profile variants (F7) ---- */
.variant-switch { display: inline-flex; gap: 2px; padding: 3px; background: var(--surface-sunk); border: 1px solid var(--border); border-radius: var(--radius); }
.variant-switch button { height: 27px; padding: 0 13px; border-radius: var(--radius-sm); font-size: 12px; font-weight: 700; color: var(--text-muted); }
.variant-switch button.on { background: var(--accent); color: var(--accent-ink); box-shadow: var(--shadow-1); }

/* dossier */
.dossier-head { position: relative; background: var(--text); color: var(--bg); border-radius: var(--radius-lg); padding: 28px 26px 24px; overflow: hidden; }
.dossier-head .wm { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); font-family: var(--font-mono); font-weight: 800; font-size: 104px; line-height: 1; opacity: .07; letter-spacing: -5px; pointer-events: none; white-space: nowrap; }
.dossier-head h1 { font-size: 32px; font-weight: 800; letter-spacing: -.025em; line-height: 1.05; }
.dossier-head .dfacts { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 12px; font-size: 12.5px; opacity: .82; position: relative; }
.stamp-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.stamp { border: 2px solid var(--border-strong); border-radius: var(--radius-lg); padding: 14px; text-align: center; background: var(--surface); }
.stamp.good { border-color: var(--st-interested); }
.stamp.warn { border-color: var(--warn); }
.stamp.crit { border-color: var(--crit); }
.stamp .st { font-size: 10.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--text-subtle); }
.stamp .sv { font-size: 22px; font-weight: 800; margin-top: 5px; }

/* command console */
.console-grid { display: grid; grid-template-columns: 340px 1fr; gap: 16px; align-items: start; }
.console-rail { position: sticky; top: 16px; display: flex; flex-direction: column; gap: 14px; }

/* ledger */
.ledger { display: flex; flex-direction: column; gap: 10px; }
.ledger-row { display: flex; gap: 14px; padding: 14px 16px; border: 1px solid var(--border); border-left: 4px solid var(--border-strong); border-radius: var(--radius); background: var(--surface); align-items: flex-start; cursor: pointer; }
.ledger-row.good { border-left-color: var(--st-interested); }
.ledger-row.warn { border-left-color: var(--warn); }
.ledger-row.crit { border-left-color: var(--crit); }
.ledger-row .lrv { margin-left: auto; text-align: right; }
.ledger-verdict { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.ledger-row.good .ledger-verdict { background: var(--good-tint); color: var(--good); }
.ledger-row.warn .ledger-verdict { background: var(--warn-tint); color: var(--warn); }
.ledger-row.crit .ledger-verdict { background: var(--crit-tint); color: var(--crit); }
.ledger-row .ledger-verdict svg { width: 14px; height: 14px; }

/* research links (F18 MVP) */
.rlink { display: flex; align-items: center; gap: 9px; padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 12.5px; font-weight: 600; background: var(--surface); }
.rlink:hover { background: var(--surface-sunk); border-color: var(--border-strong); }
.rlink svg { width: 14px; height: 14px; color: var(--text-subtle); }
.rlink .ext { margin-left: auto; color: var(--text-subtle); }

/* numbered + warning map pins (F22) */
.map .pin-lbl { font-family: var(--font-ui); font-weight: 700; fill: #fff; font-size: 8.5px; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.map .pin-ring { fill: none; stroke: var(--crit); stroke-width: 2.2; }
.map .lane-chip-bg { fill: var(--accent); }
.map .lane-chip-tx { fill: #fff; font-weight: 800; font-size: 10px; text-anchor: middle; dominant-baseline: central; font-family: var(--font-ui); }

/* contact cell */
.ccell { display: flex; flex-direction: column; gap: 1px; }
.ccell a { color: var(--accent-press); font-weight: 600; }
.ccell a:hover { text-decoration: underline; }
.ccell .miss { color: var(--text-subtle); }
.ccell .mono { font-size: 12px; }

/* dashboard batch table pipeline bar */
.pipebar { display: flex; height: 7px; border-radius: 999px; overflow: hidden; background: var(--surface-sunk); min-width: 90px; }
.pipebar i { height: 100%; }

/* ============================ v3 additions ============================ */

/* interactive map (F29) */
.map { cursor: grab; user-select: none; }
.map.panning { cursor: grabbing; }
.map-tools { position: absolute; left: 10px; top: 10px; display: flex; flex-direction: column; gap: 4px; z-index: 5; }
.map-tools button { width: 30px; height: 30px; display: grid; place-items: center; background: color-mix(in srgb, var(--surface) 92%, transparent); border: 1px solid var(--border-strong); border-radius: 7px; color: var(--text); box-shadow: var(--shadow-1); }
.map-tools button:hover { background: var(--surface-sunk); }
.map-tools button svg { width: 14px; height: 14px; }
.map-note { position: absolute; right: 10px; bottom: 8px; font-size: 9.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--text-subtle); background: color-mix(in srgb, var(--surface) 75%, transparent); padding: 2px 7px; border-radius: 999px; pointer-events: none; }
.map-empty { position: absolute; inset: 0; display: grid; place-items: center; font-size: 13px; font-weight: 600; color: var(--text-subtle); pointer-events: none; }
.map .hwy { fill: none; stroke: var(--map-line); stroke-width: 1.1; opacity: .55; }
.map .pin.tear { stroke: #fff; stroke-width: 1.1; filter: drop-shadow(0 1px 1px rgba(0,0,0,.25)); }
@media (prefers-color-scheme: dark) { .map .pin.tear { stroke: #1a1f26; } }
:root[data-theme="dark"] .map .pin.tear { stroke: #1a1f26; }
:root[data-theme="light"] .map .pin.tear { stroke: #fff; }

/* dashboard job legend toggles (F30) */
.map-legend.jobs { max-width: 250px; }
.map-legend .jobrow { display: flex; align-items: center; gap: 7px; text-align: left; font-size: 11.5px; color: var(--text-muted); padding: 3px 2px; border-radius: 5px; width: 100%; }
.map-legend .jobrow:hover { background: var(--surface-sunk); color: var(--text); }
.map-legend .jobrow.on { color: var(--text); font-weight: 600; }
.map-legend .jbox { width: 15px; height: 15px; border-radius: 4px; border: 1.5px solid var(--border-strong); background: var(--surface-2); display: grid; place-items: center; flex: none; }
.map-legend .jobrow.on .jbox { background: var(--accent); border-color: var(--accent); color: #fff; }
.map-legend .jbox svg { width: 11px; height: 11px; }

/* centered stat tiles (F27) */
.strip .cell { text-align: center; }

/* dashboard stage columns (F31) */
.coldot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: baseline; }

const MID_LAT = (TX_BOUNDS.latMin + TX_BOUNDS.latMax) / 2;
const COS_MID = Math.cos(MID_LAT * Math.PI / 180);
const MI_PER_DEG_LAT = 69.0;

/* Build an equirectangular projection fitted to a width×height box. */
function makeProjection(width, height, pad) {
  pad = pad || 14;
  const b = TX_BOUNDS;
  const projW = (b.lngMax - b.lngMin) * COS_MID;
  const projH = (b.latMax - b.latMin);
  const scale = Math.min((width - 2 * pad) / projW, (height - 2 * pad) / projH);
  const offX = (width - projW * scale) / 2;
  const offY = (height - projH * scale) / 2;
  function project(lng, lat) {
    const x = offX + (lng - b.lngMin) * COS_MID * scale;
    const y = offY + (b.latMax - lat) * scale;
    return [x, y];
  }
  return {
    project,
    scale,
    milesToPx: (mi) => (mi / MI_PER_DEG_LAT) * scale,
    pathFor: (pts) => pts.map((p, i) => (i ? "L" : "M") + project(p[0], p[1]).map(n => n.toFixed(1)).join(" ")).join(" ") + "Z"

/* Haversine great-circle distance in miles. */
function haversineMiles(lng1, lat1, lng2, lat2) {
  const R = 3958.8, toRad = Math.PI / 180;
  const dLat = (lat2 - lat1) * toRad, dLng = (lng2 - lng1) * toRad;
  const a = Math.sin(dLat / 2) ** 2 +
            Math.cos(lat1 * toRad) * Math.cos(lat2 * toRad) * Math.sin(dLng / 2) ** 2;
  return R * 2 * Math.asin(Math.sqrt(a));
}

/* Local flat-plane miles (fast, accurate over TX-scale spans) for corridor math. */
function toPlane(lng, lat) {

function pointToSegMiles(plng, plat, alng, alat, blng, blat) {

/* Distance from a point to a polyline (route), in miles. */
function pointToRouteMiles(lng, lat, route) {

  for (let i = 0; i < route.length - 1; i++) {
    const d = pointToSegMiles(lng, lat, route[i].lng, route[i].lat, route[i+1].lng, route[i+1].lat);
    if (d < min) min = d;

/* ============================================================================

   Mirrors the future Supabase schema (docs/build-plan/01-architecture.md).

   ============================================================================ */

const NOW_MS = Date.parse("2026-07-15T15:00:00Z");
const DAY = 86400000, HOUR = 3600000;

/* mulberry32 — tiny seeded PRNG so the demo data never shifts under you. */
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);

  };

const rndInt = (a, b) => Math.floor(rnd(a, b + 1));
const pick = (arr) => arr[Math.floor(rng() * arr.length)];
const chance = (p) => rng() < p;

const SUFFIX = ["Trucking","Transport","Hauling","Logistics","Carriers","Express","LLC","Inc."];

function makeCarrier(i) {
  const r = rng();
  const tier = r < 0.60 ? 1 : (r < 0.90 ? 2 : 0);

  const c0 = cityOf(cityName);

    cargoOther = pick(SG_OTHER);
    flags = ["Commodities Dry Bulk"];
    if (chance(0.6)) flags.push("Construction");
    if (chance(0.4)) flags.push("Building Materials");

      effective: fmtDate(NOW_MS - rndInt(30, 900) * DAY),
      expiring_30d: expiring,

/* ---- search matching v2 (multi-lane union + facet cargo + contactability) ---- */
function zoneMatches(c, z) {
  if (z.type === "radius") return haversineMiles(c.lng, c.lat, z.anchorLng, z.anchorLat) <= z.radiusMi;
  if (z.type === "corridor") return pointToRouteMiles(c.lng, c.lat, z.route) <= z.bufferMi;
  return false;
}
function distanceToSearch(c, zones) {
  if (!zones || !zones.length) return null;
  let min = Infinity;
  zones.forEach(z => {
    const d = z.type === "radius" ? haversineMiles(c.lng, c.lat, z.anchorLng, z.anchorLat)
                                  : pointToRouteMiles(c.lng, c.lat, z.route);
    if (d < min) min = d;
  });
  return min === Infinity ? null : min;
}
function carrierMatchesSearch(c, s) {
  // geo — UNION of lanes (F21)
  if (s.zones && s.zones.length) { if (!s.zones.some(z => zoneMatches(c, z))) return false; }
  // cargo — flags OR other-include, minus other-exclude (F14)
  if (s.cargo) {
    const flags = s.cargo.flags || [];
    const oth = s.cargo.other || {};
    const inc = (oth.enabled && oth.include) ? oth.include : [];
    const exc = (oth.enabled && oth.exclude) ? oth.exclude : [];
    if (c.cargo_other_norm && exc.includes(c.cargo_other_norm)) return false;
    const flagHit = flags.some(f => c.cargoFlags.includes(f));
    const otherHit = c.cargo_other_norm && inc.includes(c.cargo_other_norm);
    if ((flags.length || inc.length) && !(flagHit || otherHit)) return false;
  }
  if (s.forHire && c.classdef !== "Authorized For Hire") return false;
  if (s.activeOnly && !c.active) return false;
  if (s.authorizedOnly && c.ins.authority_status !== "active") return false;
  if (s.interstateOnly && c.operation !== "Interstate") return false;
  if (s.sizeMin != null && c.power_units < s.sizeMin) return false;
  if (s.sizeMax != null && c.power_units > s.sizeMax) return false;
  if (s.hasPhone && !(c.phone || c.cell)) return false;         // F16/G4
  if (s.hasEmail && !c.email) return false;                     // F16/G4
  if (s.insuranceMin && !s.keepBelow && c.ins.bipd_on_file < s.insuranceMin) return false;
  return true;
}
function searchMatches(s) { return carriers.filter(c => carrierMatchesSearch(c, s)); }

/* ---- lane helpers ---- */
function radiusLane(id, city, mi, material) {
  const c0 = cityOf(city);
  return { id, type:"radius", label:material, anchor: city + ", TX", anchorLng:c0.lng, anchorLat:c0.lat, radiusMi:mi, anchorKind:"city" };
}
function corridorLane(id, from, to, mi, material) {
  const a = cityOf(from), b = cityOf(to);
  const midLng = (a.lng + b.lng)/2 + rnd(-0.15,0.15), midLat = (a.lat + b.lat)/2;
  return { id, type:"corridor", label:material, origin: from + ", TX", dest: to + ", TX",
           originLng:a.lng, originLat:a.lat, destLng:b.lng, destLat:b.lat,
           route:[{lng:a.lng,lat:a.lat},{lng:midLng,lat:midLat},{lng:b.lng,lat:b.lat}], bufferMi:mi };
}

/* F29: map pan/zoom on the SVG viewBox. Base box is 0 0 640 520. */
const MAP_BASE = { x:0, y:0, w:640, h:520 };
function mapVB(id) {
  const s = state.mapView[id];
  if (!s) return { ...MAP_BASE };
  const p = s.split(" ").map(Number);
  return { x:p[0], y:p[1], w:p[2], h:p[3] };
}
function setMapVB(id, vb) {
  const clampW = Math.max(70, Math.min(768, vb.w));
  const k = clampW / vb.w; vb.w = clampW; vb.h = vb.h * k;
  vb.x = Math.max(-160, Math.min(800 - vb.w * 0.2, vb.x));
  vb.y = Math.max(-130, Math.min(650 - vb.h * 0.2, vb.y));
  state.mapView[id] = vb.x.toFixed(1) + " " + vb.y.toFixed(1) + " " + vb.w.toFixed(1) + " " + vb.h.toFixed(1);
  const el = document.querySelector('.map[data-mapid="' + id + '"] svg');
  if (el) el.setAttribute("viewBox", state.mapView[id]);
}
function mapZoomAt(id, factor, fx, fy) {
  const vb = mapVB(id);
  const nw = vb.w / factor, nh = vb.h / factor;
  setMapVB(id, { x: vb.x + (vb.w - nw) * (fx == null ? 0.5 : fx), y: vb.y + (vb.h - nh) * (fy == null ? 0.5 : fy), w: nw, h: nh });
}
function zoomToBox(id, x0, y0, x1, y1, pad) {
  pad = pad == null ? 30 : pad;
  const w = Math.max(60, (x1 - x0) + pad * 2), h = Math.max(50, (y1 - y0) + pad * 2);
  // keep aspect of base (640x520)
  const ar = MAP_BASE.w / MAP_BASE.h; let W = w, H = h;
  if (W / H > ar) H = W / ar; else W = H * ar;
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  setMapVB(id, { x: cx - W / 2, y: cy - H / 2, w: W, h: H });
}

function fmtRel(ms) {

  if (d < HOUR) return Math.round(d/60000) + "m ago";
  if (d < DAY) return Math.round(d/HOUR) + "h ago";

const ACT = {};   // action handlers, populated across files

  html += overlays();

/* ------------------------------- events ------------------------------- */
function mount() {

  // F29: interactive maps — wheel zoom (about cursor) + drag pan, no re-render.
  root.addEventListener("wheel", (e) => {
    const m = e.target.closest && e.target.closest('.map[data-mapid]');
    if (!m) return;
    e.preventDefault();
    const id = m.getAttribute("data-mapid"), r = m.getBoundingClientRect();
    mapZoomAt(id, e.deltaY < 0 ? 1.25 : 0.8, (e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height);
  }, { passive: false });
  let drag = null;
  root.addEventListener("mousedown", (e) => {
    const m = e.target.closest && e.target.closest('.map[data-mapid]');
    if (!m || e.target.closest(".map-legend, .map-count, .map-tools, .pin, [data-act]")) return;
    const id = m.getAttribute("data-mapid"), r = m.getBoundingClientRect(), vb = mapVB(id);
    drag = { id, sx: e.clientX, sy: e.clientY, vb, pxw: r.width };

  });
  document.addEventListener("mousemove", (e) => {
    if (!drag) return;
    const k = drag.vb.w / drag.pxw;
    setMapVB(drag.id, { x: drag.vb.x - (e.clientX - drag.sx) * k, y: drag.vb.y - (e.clientY - drag.sy) * k, w: drag.vb.w, h: drag.vb.h });
  });
  document.addEventListener("mouseup", () => {
    if (drag) { const m = document.querySelector('.map[data-mapid="' + drag.id + '"]'); if (m) m.classList.remove("panning"); drag = null; }
  });

function onClick(e) {
  const t = e.target.closest("[data-act]");
  const inMenu = e.target.closest(".menu");
  if (state.menu && !inMenu && !(t && t.dataset.act === state.menu.type)) closeMenu();
  if (!t) return;
  const act = t.dataset.act;
  // Don't open a row when the click landed on an in-row control (checkbox, status select, buttons).
  if (act === "openCarrier" && e.target.closest("select, input, button, label")) return;
  // Backdrop click closes the modal; clicks inside the modal body do not.
  if (act === "closeModal" && t.classList.contains("scrim") && e.target.closest(".modal")) return;
  if (ACT[act]) { e.preventDefault(); ACT[act]({ ...t.dataset }, e, t); }
}

  const t = e.target;
  if (e.key === "Enter" && t.dataset && t.dataset.keyadd) {
    e.preventDefault();
    if (ACT[t.dataset.keyadd]) ACT[t.dataset.keyadd]({ v: t.value });
  }
}

  const t = e.target;
  if (t.dataset && t.dataset.change && ACT[t.dataset.change]) {

  if (t.dataset.live && ACT[t.dataset.live]) ACT[t.dataset.live]({ ...t.dataset, value: t.value }, e, t);
  if (t.dataset.model) { setModel(t.dataset.model, t.value); }
}

/* ------------------------------- map (F29/F37) ------------------------------- */
function tearPin(x, y, r, fill, num, warn, inter, title) {
  const rb = r;                       // bulb radius
  const cy = y - 2.3 * rb;            // bulb center
  const d = "M " + x + " " + y +
    " C " + (x - rb*1.05) + " " + (y - rb*1.0) + ", " + (x - rb*1.3) + " " + (y - rb*1.55) + ", " + (x - rb*1.3) + " " + cy +
    " A " + (rb*1.3) + " " + (rb*1.3) + " 0 1 1 " + (x + rb*1.3) + " " + cy +
    " C " + (x + rb*1.3) + " " + (y - rb*1.55) + ", " + (x + rb*1.05) + " " + (y - rb*1.0) + ", " + x + " " + y + " Z";
  const ring = warn ? '<circle class="pin-ring" cx="' + x + '" cy="' + cy + '" r="' + (rb*1.75) + '"/>' : "";
  const numEl = num != null ? '<text class="pin-lbl" style="font-size:' + (rb*1.15) + 'px" x="' + x + '" y="' + cy + '">' + num + "</text>" : "";
  return ring + '<path class="pin tear" d="' + d + '" style="fill:' + fill + '"' + (inter || "") + "><title>" + esc(title || "") + "</title></path>" + numEl;
}
function mapCore(pins, zones) {
  const proj = PROJ;
  const land = proj.pathFor(TX_OUTLINE);
  const hwys = TX_HIGHWAYS.map(h => '<path class="hwy" d="' + h.pts.map((p, i) => (i ? "L" : "M") + proj.project(p[0], p[1]).map(n => n.toFixed(1)).join(" ")).join(" ") + '"/>').join("");
  const anchorMark = (x, y) => '<circle class="anchor" cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="4"/>';
  const laneChip = (x, y, zi) => { const L = "ABCDEFGH"[zi] || "?"; return '<circle class="lane-chip-bg" cx="' + x.toFixed(1) + '" cy="' + (y-13).toFixed(1) + '" r="7.5"/><text class="lane-chip-tx" x="' + x.toFixed(1) + '" y="' + (y-13).toFixed(1) + '">' + L + "</text>"; };
  let overlay = "";
  (zones || []).forEach((z, zi) => {
    if (z.type === "radius") {
      const p = proj.project(z.anchorLng, z.anchorLat), r = proj.milesToPx(z.radiusMi);
      overlay += '<circle class="radius-fill" cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="' + r.toFixed(1) + '"/>' + anchorMark(p[0], p[1]) + laneChip(p[0], p[1], zi);
    } else if (z.type === "corridor" && z.route) {
      const pts = z.route.map(q => proj.project(q.lng, q.lat));
      const d = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
      const bw = proj.milesToPx(z.bufferMi) * 2;
      overlay += '<path class="corridor-band" style="stroke-width:' + bw.toFixed(1) + 'px" d="' + d + '"/><path class="corridor-line" d="' + d + '"/>' + pts.map(p => anchorMark(p[0], p[1])).join("") + laneChip(pts[0][0], pts[0][1], zi);
    }
  });
  const cityDots = CITIES.map(c => { const p = proj.project(c.lng, c.lat); return '<circle class="city-dot" cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="1.8"/><text class="city-lbl" x="' + (p[0]+4.5).toFixed(1) + '" y="' + (p[1]+3).toFixed(1) + '">' + esc(c.name) + "</text>"; }).join("");
  const pinEls = pins.map(p => {
    const q = proj.project(p.lng, p.lat), fill = p.fill || "var(--accent)";
    const inter = p.dot ? ' data-act="openCarrier" data-dot="' + p.dot + '" data-from="' + (p.from||"") + '" style="cursor:pointer"' :

    if (p.shape === "pin") return tearPin(q[0], q[1], p.r || 6, fill, p.num, p.warn, inter, p.title);
    const ring = p.warn ? '<circle class="pin-ring" cx="' + q[0].toFixed(1) + '" cy="' + q[1].toFixed(1) + '" r="' + ((p.r||4)+2) + '"/>' : "";
    return ring + '<circle class="pin" cx="' + q[0].toFixed(1) + '" cy="' + q[1].toFixed(1) + '" r="' + (p.r||4) + '" style="fill:' + fill + '"' + inter + "><title>" + esc(p.title||"") + "</title></circle>";
  }).join("");
  return '<svg viewBox="0 0 640 520" preserveAspectRatio="xMidYMid meet"><path class="tx-land" d="' + land + '"/>' + hwys + cityDots + overlay + pinEls + "</svg>";
}

function mapLegend(rows) { return '<div class="map-legend">' + rows.map(r => '<div class="lg"><span class="sw" style="background:' + r[0] + '"></span>' + r[1] + "</div>").join("") + "</div>"; }
function statusLegend(counts) {

function zoneBBox(zones) {
  const proj = PROJ; let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  zones.forEach(z => {
    if (z.type === "radius") { const p = proj.project(z.anchorLng, z.anchorLat), r = proj.milesToPx(z.radiusMi); x0 = Math.min(x0, p[0]-r); x1 = Math.max(x1, p[0]+r); y0 = Math.min(y0, p[1]-r); y1 = Math.max(y1, p[1]+r); }
    else if (z.route) { const b = proj.milesToPx(z.bufferMi); z.route.forEach(q => { const p = proj.project(q.lng, q.lat); x0 = Math.min(x0, p[0]-b); x1 = Math.max(x1, p[0]+b); y0 = Math.min(y0, p[1]-b); y1 = Math.max(y1, p[1]+b); }); }
  });
  return [x0, y0, x1, y1];
}

/* ------------------------------- DASHBOARD (F27/F28/F30/F31) ------------------------------- */
function screenDashboard() {
  const totalCarriers = new Set(DB.batchCarriers.map(b => b.dot)).size;
  const interested = DB.batchCarriers.filter(b => effStatus(b.batch_id, b.dot) === "interested" && !effDnc(b.dot)).length;
  const promoted = new Set(DB.batchCarriers.filter(b => effPromoted(b.dot)).map(b => b.dot)).size;
  const withPhone = new Set(DB.batchCarriers.filter(b => { const c = DB.carrierByDot[b.dot]; return c.phone || c.cell; }).map(b => b.dot)).size;
  const strip = statStrip(stat("Active batches", DB.batches.length) + stat("Carriers in play", totalCarriers) + stat("With phone", withPhone) + stat("Interested", interested, "good") + stat("Promoted", promoted, "accent"));

  // F30: map starts EMPTY; jobs toggle on via the legend; zones stay accent orange.
  const onJobs = DB.batches.filter(b => state.dashJobs[b.id]);
  const zones = []; onJobs.forEach(b => b.zones.forEach(z => zones.push(z)));
  const pins = onJobs.map(b => { const z = b.zones[0]; const p = z.type === "radius" ? { lng:z.anchorLng, lat:z.anchorLat } : { lng:z.originLng, lat:z.originLat }; const bi = DB.batches.indexOf(b); return { lng:p.lng, lat:p.lat, num: bi+1, fill:"var(--accent)", title:b.name, r:8, shape:"pin", job:b.id }; });
  const legend = '<div class="map-legend jobs"><div class="lg" style="font-weight:700;color:var(--text)">Jobs — toggle to show</div>' +
    DB.batches.map((b, bi) => { const on = !!state.dashJobs[b.id]; return '<button class="lg jobrow ' + (on ? "on" : "") + '" data-act="dashToggleJob" data-id="' + b.id + '"><span class="jbox">' + (on ? icon("check") : "") + '</span><span class="mono" style="color:var(--accent-press);font-weight:800">' + (bi+1) + '</span> ' + esc(b.name) + "</button>"; }).join("") +
    (onJobs.length ? '<div class="lg subtle" style="font-size:10.5px">click a pin or name again to zoom</div>' : "") + "</div>";
  const map = mapBox("dash", pins, zones, legend + (onJobs.length === 0 ? '<div class="map-empty">Toggle a job to plot it</div>' : ""), 360);

  // F31: per-stage numeric columns; F40/G15: numerics centered; F39/F41: one thought per line.
  const stageHead = STATUS_ORDER.map(k => '<th class="center" title="' + STATUS[k].label + '"><span class="coldot" style="background:' + statusVar(k) + '"></span>' + ({new:"New",attempted:"Att",contacted:"Con",interested:"Int",not_a_fit:"NaF"}[k]) + "</th>").join("");
  const laneLine = z => z.type === "radius" ? esc(z.anchor.replace(", TX","")) + " · " + z.radiusMi + " mi radius" : esc(z.origin.replace(", TX","")) + " → " + esc(z.dest.replace(", TX","")) + " · " + z.bufferMi + " mi";
  const rows = DB.batches.map((b, bi) => {
    const c = statusCounts(b.id);
    const la = activityForBatch(b.id)[0];
    const stageCells = STATUS_ORDER.map(k => '<td class="center mono" style="' + (c[k] ? "" : "color:var(--text-subtle)") + '">' + c[k] + "</td>").join("");
    return '<tr class="clickable" data-act="openBatch" data-id="' + b.id + '">' +
      '<td class="mono center" style="width:28px;color:var(--accent-press);font-weight:800">' + (bi+1) + "</td>" +
      "<td><div class='co oneline'><span class='nm'>" + esc(b.name) + "</span><span class='meta'>" + esc(b.customer) + "</span><span class='meta'>" + esc(b.job) + "</span></div></td>" +
      "<td><div class='lanes-cell'>" + b.zones.map(z => "<div>" + laneLine(z) + "</div>").join("") + "</div></td>" +
      "<td class='center mono'>" + c.total + "</td>" + stageCells +
      "<td class='center'>" + (c.dnc ? '<span class="mono" style="color:var(--st-dnc)">' + c.dnc + "</span>" : '<span class="subtle">0</span>') + "</td>" +
      "<td>" + (c.warnings ? '<span class="wchip crit">' + icon("alert") + c.warnings + "</span>" : '<span class="subtle">—</span>') + "</td>" +
      "<td class='muted center' style='font-size:12px;white-space:nowrap'>" + (la ? fmtRel(la.at) : "—") + "</td>" +
      '<td class="right"><button class="btn icon ghost sm" data-act="batchMenu" data-id="' + b.id + '">' + icon("dots") + "</button></td></tr>";
  }).join("");
  const table = '<div class="tbl-wrap"><table class="tbl"><thead><tr><th class="center">#</th><th>Batch</th><th>Lanes</th><th class="center">Carriers</th>' + stageHead + '<th class="center">DNC</th><th>Warn</th><th class="center">Last activity</th><th></th></tr></thead><tbody>' + rows + "</tbody></table></div>";

  const inner = '<div class="page"><div class="page-head" style="justify-content:center;text-align:center"><div class="h1">Dashboard</div><div class="spacer"></div><button class="btn primary" data-act="newBatch">' + icon("plus") + " New Search</button></div>" +

function wizardSearch(w) {

  return { zones:w.lanes, cargo:w.cargo, forHire:w.filters.forHire, activeOnly:w.filters.activeOnly, authorizedOnly:w.filters.authorizedOnly,

/* F48: five display-organization strategies for the same content, behind a picker. */
const NS_LAYOUTS = [[1,"Split Panel"],[2,"Map Canvas"],[3,"Columns"],[4,"Tabbed"],[5,"Command Chips"]];
function screenBuilder() {
  const w = state.wizard, L = state.nsLayout || 1;
  const picker = '<div class="ns-picker"><span class="eyebrow">Layout options — pick one, we iterate</span><div class="variant-switch">' +
    NS_LAYOUTS.map(v => '<button class="' + (L === v[0] ? "on" : "") + '" data-act="nsLayout" data-l="' + v[0] + '">' + v[0] + " · " + v[1] + "</button>").join("") + "</div></div>";

  return appShell(inner, crumb([{ label:"Dashboard", act:"nav", to:"dashboard" }, { label:"New Search" }]));

function builderMap(w, h, withCov, extraCls) {
  const s = wizardSearch(w), zones = wizardZones(w), matches = searchMatches(Object.assign({}, s, { zones }));
  const pins = matches.slice(0, 400).map(c => ({ lng:c.lng, lat:c.lat, r:3.5, warn:warningsFor(c).length > 0, title:c.legal_name }));
  let cov = "";
  if (withCov) {
    const wp = matches.filter(c => c.phone || c.cell).length, we = matches.filter(c => c.email).length, t1 = matches.filter(c => c.tier === 1).length;
    cov = '<div class="strip mt-12" id="wiz-cov">' + stat("Matches", matches.length, "accent") + stat("With phone", wp) + stat("With email", we, we ? "" : "crit") + stat("Sand & gravel", t1, "good") + "</div>";
  }
  return '<div class="' + (extraCls || "") + '"><div id="wiz-map-holder" data-h="' + h + '">' + mapBox("builder", pins, zones, mapCount(matches.length) + mapLegend([["var(--accent)","Matches filters"],["var(--crit)","Has a warning flag"]]), h) + "</div>" + cov + "</div>";

function workingRows(batchId) {
  const b = DB.batches.find(x => x.id === batchId), f = state.list;
  let rows = batchMembers(batchId).map(m => {
    const c = DB.carrierByDot[m.dot];
    return { c, dnc: effDnc(m.dot), status: effStatus(batchId, m.dot), dist: distanceToSearch(c, b.zones),
             warns: warningsFor(c), logs: logsForDot(m.dot), promoted: effPromoted(m.dot) };
  });
  if (f.status !== "all") rows = rows.filter(r => f.status === "dnc" ? r.dnc : (!r.dnc && r.status === f.status));
  if (f.warnings) rows = rows.filter(r => r.warns.length);
  if (f.q) { const q = f.q.toLowerCase(); rows = rows.filter(r => r.c.legal_name.toLowerCase().includes(q) || String(r.c.dot).includes(q) || r.c.city.toLowerCase().includes(q) || (r.c.contact_name||"").toLowerCase().includes(q)); }
  if (f.insurance !== "any") rows = rows.filter(r => r.c.ins.bipd_on_file >= +f.insurance);
  if (f.size !== "any") { const [lo, hi] = SIZE_RANGES[f.size]; rows = rows.filter(r => (lo==null||r.c.power_units>=lo) && (hi==null||r.c.power_units<=hi)); }
  if (f.contact === "phone") rows = rows.filter(r => r.c.phone || r.c.cell);
  else if (f.contact === "email") rows = rows.filter(r => r.c.email);
  else if (f.contact === "missing") rows = rows.filter(r => !r.c.email && !(r.c.phone||r.c.cell));
  rows.sort((a, z) => f.sort === "distance" ? (a.dist||0)-(z.dist||0) : f.sort === "size" ? z.c.power_units-a.c.power_units :
    f.sort === "recent" ? ((z.logs[0]?.at)||0)-((a.logs[0]?.at)||0) : f.sort === "warnings" ? z.warns.length-a.warns.length : a.c.legal_name.localeCompare(z.c.legal_name));
  return rows;
}

    return '<tr class="clickable ' + (warn ? "warn-row" : "") + (r.dnc ? " dnc" : "") + (state.selection[c.dot] ? " sel" : "") + '" data-act="openCarrier" data-dot="' + c.dot + '" data-from="' + b.id + '">' +
      cb +
      "<td>" + tagsFor(c) + "</td>" +

      "<td class='right' style='white-space:nowrap'><span class='row gap-4'>" + quick + "</span></td></tr>";
  }).join("");
  return '<div class="tbl-wrap"><table class="tbl"><thead><tr><th><label class="check"><input type="checkbox" ' + (allSel?"checked":"") + ' data-change="selAll"><span class="box">' + icon("check") + '</span></label></th><th style="min-width:86px">Tags</th><th style="min-width:200px">Carrier</th><th style="min-width:170px">Contact</th><th class="center">Location</th><th class="center">Trucks</th><th>Insurance</th><th style="min-width:150px">Warnings</th><th class="center">Status</th><th class="center" style="min-width:130px">Last contact</th><th></th></tr></thead><tbody>' + body + "</tbody></table></div>";
}

/* ------------------------------- CARRIER PROFILE (F7 — 3 variants) ------------------------------- */
function screenProfile() {
  const c = DB.carrierByDot[state.activeCarrierDot];
  if (!c) { state.screen = "dashboard"; return screenDashboard(); }
  const fromBatch = state.profileFromBatch ? DB.batches.find(b => b.id === state.profileFromBatch) : null;
  const crumbs = fromBatch ? [{ label:"Dashboard", act:"nav", to:"dashboard" }, { label:fromBatch.name, act:"openBatch", to:fromBatch.id }, { label:c.legal_name }] : [{ label:"Dashboard", act:"nav", to:"dashboard" }, { label:c.legal_name }];
  // F7 resolved: owner picked COMMAND CONSOLE. (Dossier/Ledger renderers retained
  // below for reference; reachable only via ACT.profVariant in dev tooling.)
  const inner = '<div class="page wide">' + (fromBatch ? '<a class="link row gap-6 center" style="margin-bottom:10px" data-act="openBatch" data-id="' + fromBatch.id + '">' + icon("chevL") + " Back to " + esc(fromBatch.name) + "</a>" : "") +
    (state.profileVariant === "dossier" ? profDossier(c, fromBatch) : state.profileVariant === "ledger" ? profLedger(c, fromBatch) : profConsole(c, fromBatch)) + "</div>";
  return appShell(inner, crumb(crumbs));
}
function idFacts(c) { return [c.entity, c.classdef, c.operation, c.power_units + " trucks / " + c.drivers + " drivers", "MCS-150 " + c.mcs150, c.street + ", " + c.city + ", TX " + c.zip]; }
function headerBadges(c, dnc) {
  return (c.tier===1?'<span class="badge tier1">Sand &amp; Gravel</span>':c.tier===2?'<span class="badge tier2">Tier 2</span>':'<span class="badge plain">No cargo match</span>') +
    (c.active?' <span class="badge good"><span class="dot"></span>Active</span>':' <span class="badge crit">Inactive</span>') +
    (dnc?' <span class="badge dnc">'+icon("lock")+" Do Not Call</span>":"");
}
function promoteBtn(c) { const pr = effPromoted(c.dot); return pr ? '<span class="badge good" style="height:34px;padding:0 12px">' + icon("check") + " Promoted</span>" : '<button class="btn primary" data-act="promote" data-dot="' + c.dot + '">' + icon("arrowR") + " Mark as Promoted</button>"; }
function verdictOf(c, kind) {
  const w = warningsFor(c);
  if (kind === "insurance") return w.includes("no_insurance")||w.includes("authority_not_active") ? "crit" : (w.includes("insurance_below_standard")||w.includes("insurance_expiring_30d")) ? "warn" : "good";
  if (kind === "safety") return w.includes("safety_rating") ? "crit" : (w.includes("high_oos")||w.includes("recent_crashes")) ? "warn" : (c.safety.rating==="Satisfactory"?"good":"plain");
  if (kind === "inspections") return c.inspections.some(x => x.result === "OOS") ? "warn" : (c.inspections.length ? "good" : "plain");
  return "plain";
}
function verificationTiles(c) {
  const iv = verdictOf(c,"insurance"), sv = verdictOf(c,"safety"), nv = verdictOf(c,"inspections");
  const vi = { good:"shieldcheck", warn:"alert", crit:"alert", plain:"shield" };
  return '<div class="vtiles">' +
    '<div class="vtile ' + iv + '"><div class="vhead"><span class="vic">' + icon(vi[iv]) + '</span><span class="vname">Insurance</span></div><div class="vbig">' + fmtMoney(c.ins.bipd_on_file) + '</div><div class="vsub">Authority ' + c.ins.authority_status + (c.ins.expiring_30d?" · expiring ≤30d":"") + '</div></div>' +
    '<div class="vtile ' + sv + '"><div class="vhead"><span class="vic">' + icon(vi[sv]) + '</span><span class="vname">Safety</span></div><div class="vbig">' + c.safety.rating + '</div><div class="vsub">' + c.safety.crash_total + ' crashes · ' + c.safety.vehicle_oos_pct + '% veh OOS</div></div>' +
    '<div class="vtile ' + nv + '"><div class="vhead"><span class="vic">' + icon(vi[nv]) + '</span><span class="vname">Inspections</span></div><div class="vbig">' + (c.inspections.length || c.safety.inspections_24mo) + '</div><div class="vsub">' + (c.inspections.length ? c.inspections.filter(x=>x.result==="OOS").length + " OOS on file" : "last 24 months") + '</div></div>' +
    "</div>";
}
function contactPanel(c, fromBatch, dnc) {
  const statusControl = dnc ? '<div class="badge dnc" style="height:32px">' + icon("lock") + " Do Not Call — outreach disabled</div>" :
    fromBatch ? '<select class="select" data-change="rowStatus" data-dot="' + c.dot + '" data-batch="' + fromBatch.id + '" style="font-weight:700;color:' + statusVar(effStatus(fromBatch.id,c.dot)) + '">' + STATUS_ORDER.map(k => '<option value="' + k + '"' + sel(effStatus(fromBatch.id,c.dot),k) + ">" + STATUS[k].label + "</option>").join("") + '<option value="dnc">Do Not Call…</option></select>' :
    '<div class="subtle" style="font-size:12px">Open from a batch to set a working status.</div>';
  const logBtns = dnc ? "" : '<div class="row gap-6 mt-8">' + Object.keys(CHANNEL).map(ch => '<button class="btn sm grow" data-act="logCall" data-dot="' + c.dot + '"' + (fromBatch?' data-batch="'+fromBatch.id+'"':"") + ' data-channel="' + ch + '">' + icon(CHANNEL[ch].ic) + " " + CHANNEL[ch].label + "</button>").join("") + "</div>";
  return '<div class="card" style="padding:16px"><div class="eyebrow" style="margin-bottom:10px">Call workflow' + (fromBatch?' <span class="subtle">· '+esc(fromBatch.name)+"</span>":"") + "</div>" +
    '<div class="field" style="margin-bottom:8px"><span class="label">Status in this batch</span>' + statusControl + "</div>" + logBtns +
    '<div class="eyebrow" style="margin:16px 0 2px">Contact history <span class="subtle">· all batches</span></div>' + timeline(c) + "</div>";
}
function timeline(c) {
  const logs = logsForDot(c.dot);
  if (!logs.length) return '<div class="subtle" style="font-size:12.5px;padding:10px 0">No contact attempts logged yet.</div>';
  return logs.map(l => { const u = DB.userById[l.user_id], bt = DB.batches.find(b => b.id === l.batch_id), ch = CHANNEL[l.channel||"call"];
    return '<div class="row gap-10" style="padding:11px 0;border-top:1px solid var(--border)"><span class="feed-ic">' + icon(ch.ic) + '</span><div style="min-width:0;flex:1"><div class="row between center"><span class="badge ' + dispoCls(l.disposition) + '">' + ch.label + " · " + DISPO_LABEL[l.disposition] + '</span><span class="subtle mono" style="font-size:11px">' + fmtRel(l.at) + "</span></div>" +
    (l.notes?'<div style="font-size:12.5px;margin-top:5px">'+esc(l.notes)+"</div>":"") + (l.next_steps?'<div class="subtle" style="font-size:11.5px;margin-top:3px">Next: '+esc(l.next_steps)+"</div>":"") +
    '<div class="subtle" style="font-size:11px;margin-top:4px">' + esc(u?u.name.split(" ")[0]:"") + (bt?" · "+esc(bt.name):"") + "</div></div></div>"; }).join("");
}
function dispoCls(d) { return ["connected","interested","replied"].includes(d) ? "good" : ["no_answer","wrong_number","not_interested","bounced","no_response"].includes(d) ? "plain" : "warn"; }
function memberships(c) {
  const mems = DB.batchCarriers.filter(b => b.dot === c.dot);
  if (!mems.length) return "";
  return '<div class="card" style="padding:16px"><div class="eyebrow" style="margin-bottom:10px">In these batches <span class="subtle">· ' + mems.length + "</span></div>" +
    mems.map(m => { const b = DB.batches.find(x => x.id === m.batch_id); return '<button class="mem-row row between center" data-act="openBatchCarrier" data-batch="' + b.id + '" data-dot="' + c.dot + '"><span style="font-size:13px;font-weight:600;text-align:left">' + esc(b.name) + "</span>" + (effDnc(c.dot)?badge("dnc"):badge(effStatus(b.id,c.dot))) + "</button>"; }).join("") +

function researchLinks(c) {
  const gq = encodeURIComponent('"' + c.legal_name + '" ' + c.city + ' TX trucking');
  const links = [
    ["search", "Google the company", "https://www.google.com/search?q=" + gq],
    ["pin", "Google Maps / Business", "https://www.google.com/maps/search/" + encodeURIComponent(c.legal_name + " " + c.city + " TX")],
    ["shield", "FMCSA SAFER snapshot", "https://safer.fmcsa.dot.gov/query.asp?query_type=queryCarrierSnapshot&query_param=USDOT&query_string=" + c.dot],

    links.map(l => '<a class="rlink" href="' + l[2] + '" target="_blank" rel="noopener">' + icon(l[0]) + esc(l[1]) + '<span class="ext">' + icon("external") + "</span></a>").join("") + "</div></div>";
}

function dncToggle(c, dnc) { return '<label class="switch danger"><input type="checkbox" ' + (dnc?"checked":"") + ' data-act="toggleDnc" data-dot="' + c.dot + '"><span class="track"></span><span><b>Do Not Call</b> <span class="subtle">— global, every batch &amp; channel</span></span></label>'; }
/* --- variant: Command Console --- */
function profConsole(c, fromBatch) {
  const dnc = effDnc(c.dot), warn = warningsFor(c).length > 0;
  const header = '<div class="card ' + (warn?"":"") + '" style="padding:18px 20px;margin-bottom:16px' + (warn?";background:var(--crit-tint);border-color:color-mix(in srgb,var(--crit) 25%,var(--border))":"") + '"><div class="row between wrap gap-12" style="align-items:flex-start"><div style="min-width:0"><div class="row gap-10 center wrap"><h1 style="font-size:22px;font-weight:800">' + esc(c.legal_name) + "</h1>" + headerBadges(c, dnc) + '</div><div class="row gap-16 mt-8 muted" style="font-size:13px;flex-wrap:wrap"><span>USDOT <b class="mono" style="color:var(--text)">' + c.dot + "</b></span>" + (c.dba?"<span>DBA "+esc(c.dba)+"</span>":"") + idFacts(c).slice(0,3).map(f => "<span>"+esc(f)+"</span>").join("") + "</div>" + (warn ? '<div class="wchips mt-8">' + warnChips(c.dot) + "</div>" : "") + "</div>" + promoteBtn(c) + "</div></div>";

function profDossier(c, fromBatch) {

/* --- variant: Verification Ledger --- */
function profLedger(c, fromBatch) {
  const dnc = effDnc(c.dot);
  const row = (kind, name, big, sub) => { const v = verdictOf(c, kind); const vi = { good:"shieldcheck", warn:"alert", crit:"alert", plain:"shield" }; return '<div class="ledger-row ' + v + '"><span class="ledger-verdict">' + icon(vi[v]) + '</span><div style="flex:1"><div style="font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-subtle)">' + name + '</div><div style="font-size:16px;font-weight:800;margin-top:2px">' + big + '</div><div class="subtle" style="font-size:12px">' + sub + "</div></div></div>"; };
  const contactRow = (function(){ const has = (c.phone||c.cell) && c.email && c.contact_name; const v = has?"good":(c.phone||c.cell)?"warn":"crit"; return '<div class="ledger-row ' + v + '"><span class="ledger-verdict">' + icon("phone") + '</span><div style="flex:1"><div style="font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-subtle)">Contactability</div><div style="margin-top:4px">' + contactStrip(c) + "</div></div></div>"; })();
