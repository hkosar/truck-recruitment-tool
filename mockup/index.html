<style>
/* ============================================================================
   Twisted Nail — Carrier Recruiter  ·  "Aggregate Dispatch Console"
   Design system: asphalt/concrete neutrals · burnt-orange accent · labeled
   semantic status chips · mono for data · light + dark, token-based.
   ============================================================================ */

:root {
  /* --- Neutrals: "concrete" (light), slight warm-grey bias, deliberately picked --- */
  --bg:            #eceae5;   /* room / behind surfaces */
  --surface:       #f7f6f3;   /* primary panels */
  --surface-2:     #fbfaf8;   /* raised / rows */
  --surface-sunk:  #e4e2dc;   /* wells, tracks */
  --border:        #d6d3cb;
  --border-strong: #bfbbb0;
  --text:          #22262b;   /* asphalt ink */
  --text-muted:    #5c6169;
  --text-subtle:   #8b8f96;

  /* --- Accent: burnt safety-orange (the dump-truck color) --- */
  --accent:        #e8611d;
  --accent-hover:  #cf5314;
  --accent-press:  #b8480f;
  --accent-ink:    #ffffff;   /* text on accent */
  --accent-tint:   #fbe7d8;   /* faint fill */
  --accent-tint-2: #f6d3ba;
  --accent-ring:   rgba(232, 97, 29, 0.38);

  /* --- Pipeline status (labeled, distinct from accent) --- */
  --st-new:        #64748b;  --st-new-tint:      #e7eaef;
  --st-attempted:  #b07d10;  --st-attempted-tint:#f6eccf;
  --st-contacted:  #2f6fed;  --st-contacted-tint:#dfe8fd;
  --st-interested: #157f43;  --st-interested-tint:#d6efdf;
  --st-notfit:     #8a8f98;  --st-notfit-tint:   #e8e8e6;
  --st-dnc:        #d0342c;  --st-dnc-tint:      #f8dcd9;

  /* --- Semantic (good/warn/crit/info) --- */
  --good: #157f43;  --warn: #b07d10;  --crit: #d0342c;  --info: #2f6fed;
  --good-tint:#d6efdf; --warn-tint:#f6eccf; --crit-tint:#f8dcd9; --info-tint:#dfe8fd;

  /* --- Form / geometry / motion --- */
  --radius:    6px;
  --radius-sm: 4px;
  --radius-lg: 10px;
  --shadow-1: 0 1px 2px rgba(24,26,29,.06), 0 1px 1px rgba(24,26,29,.04);
  --shadow-2: 0 4px 14px rgba(24,26,29,.10), 0 2px 4px rgba(24,26,29,.06);
  --shadow-pop: 0 12px 34px rgba(24,26,29,.20), 0 4px 10px rgba(24,26,29,.12);
  --map-land:  #dfe6e4;
  --map-land-2:#cfd8d6;
  --map-line:  #a7b2b0;

  --sidebar-w: 236px;
  --topbar-h:  56px;

  --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "SFMono-Regular", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;

  --ease: cubic-bezier(.4, 0, .2, 1);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg:            #0e1216;   /* asphalt */
    --surface:       #171c22;
    --surface-2:     #1e242b;
    --surface-sunk:  #0b0f13;
    --border:        #2b333c;
    --border-strong: #3a444f;
    --text:          #e7eaed;
    --text-muted:    #a3abb5;
    --text-subtle:   #6f7883;

    --accent:        #f26f2b;
    --accent-hover:  #f9813f;
    --accent-press:  #d95e1c;
    --accent-ink:    #1a0f07;
    --accent-tint:   #2c1a0f;
    --accent-tint-2: #3d2413;
    --accent-ring:   rgba(242, 111, 43, 0.45);

    --st-new:#93a0b2;        --st-new-tint:#232b34;
    --st-attempted:#d6a53a;  --st-attempted-tint:#33290f;
    --st-contacted:#6fa1ff;  --st-contacted-tint:#152439;
    --st-interested:#48bd77; --st-interested-tint:#122a1c;
    --st-notfit:#828a94;     --st-notfit-tint:#242a30;
    --st-dnc:#f2685f;        --st-dnc-tint:#361715;

    --good:#48bd77; --warn:#d6a53a; --crit:#f2685f; --info:#6fa1ff;
    --good-tint:#122a1c; --warn-tint:#33290f; --crit-tint:#361715; --info-tint:#152439;

    --shadow-1: 0 1px 2px rgba(0,0,0,.4);
    --shadow-2: 0 6px 18px rgba(0,0,0,.5);
    --shadow-pop: 0 16px 40px rgba(0,0,0,.6);
    --map-land:  #202a2d;
    --map-land-2:#2a373a;
    --map-line:  #3f4f52;
  }
}

/* Explicit theme overrides win over the media query in both directions */
:root[data-theme="light"] {
  --bg:#eceae5; --surface:#f7f6f3; --surface-2:#fbfaf8; --surface-sunk:#e4e2dc;
  --border:#d6d3cb; --border-strong:#bfbbb0; --text:#22262b; --text-muted:#5c6169; --text-subtle:#8b8f96;
  --accent:#e8611d; --accent-hover:#cf5314; --accent-press:#b8480f; --accent-ink:#ffffff;
  --accent-tint:#fbe7d8; --accent-tint-2:#f6d3ba; --accent-ring:rgba(232,97,29,.38);
  --st-new:#64748b; --st-new-tint:#e7eaef; --st-attempted:#b07d10; --st-attempted-tint:#f6eccf;
  --st-contacted:#2f6fed; --st-contacted-tint:#dfe8fd; --st-interested:#157f43; --st-interested-tint:#d6efdf;
  --st-notfit:#8a8f98; --st-notfit-tint:#e8e8e6; --st-dnc:#d0342c; --st-dnc-tint:#f8dcd9;
  --good:#157f43; --warn:#b07d10; --crit:#d0342c; --info:#2f6fed;
  --good-tint:#d6efdf; --warn-tint:#f6eccf; --crit-tint:#f8dcd9; --info-tint:#dfe8fd;
  --shadow-1:0 1px 2px rgba(24,26,29,.06),0 1px 1px rgba(24,26,29,.04);
  --shadow-2:0 4px 14px rgba(24,26,29,.10),0 2px 4px rgba(24,26,29,.06);
  --shadow-pop:0 12px 34px rgba(24,26,29,.20),0 4px 10px rgba(24,26,29,.12);
  --map-land:#dfe6e4; --map-land-2:#cfd8d6; --map-line:#a7b2b0;
}
:root[data-theme="dark"] {
  --bg:#0e1216; --surface:#171c22; --surface-2:#1e242b; --surface-sunk:#0b0f13;
  --border:#2b333c; --border-strong:#3a444f; --text:#e7eaed; --text-muted:#a3abb5; --text-subtle:#6f7883;
  --accent:#f26f2b; --accent-hover:#f9813f; --accent-press:#d95e1c; --accent-ink:#1a0f07;
  --accent-tint:#2c1a0f; --accent-tint-2:#3d2413; --accent-ring:rgba(242,111,43,.45);
  --st-new:#93a0b2; --st-new-tint:#232b34; --st-attempted:#d6a53a; --st-attempted-tint:#33290f;
  --st-contacted:#6fa1ff; --st-contacted-tint:#152439; --st-interested:#48bd77; --st-interested-tint:#122a1c;
  --st-notfit:#828a94; --st-notfit-tint:#242a30; --st-dnc:#f2685f; --st-dnc-tint:#361715;
  --good:#48bd77; --warn:#d6a53a; --crit:#f2685f; --info:#6fa1ff;
  --good-tint:#122a1c; --warn-tint:#33290f; --crit-tint:#361715; --info-tint:#152439;
  --shadow-1:0 1px 2px rgba(0,0,0,.4); --shadow-2:0 6px 18px rgba(0,0,0,.5); --shadow-pop:0 16px 40px rgba(0,0,0,.6);
  --map-land:#202a2d; --map-land-2:#2a373a; --map-line:#3f4f52;
}

/* --------------------------------- reset --------------------------------- */
*, *::before, *::after { box-sizing: border-box; }
* { margin: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font-ui);
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
#app { height: 100vh; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: none; }
a { color: inherit; text-decoration: none; }
svg { display: block; width: 16px; height: 16px; flex: none; }
.badge svg { width: 13px; height: 13px; }
.crumbs svg { width: 14px; height: 14px; }
.modal-head svg { width: 20px; height: 20px; color: var(--accent); }
::selection { background: var(--accent-tint-2); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.num  { font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--text-subtle); }
.muted { color: var(--text-muted); }
.subtle{ color: var(--text-subtle); }

/* --------------------------------- buttons --------------------------------- */
.btn {
  display: inline-flex; align-items: center; gap: 7px;
  height: 34px; padding: 0 14px;
  border-radius: var(--radius);
  border: 1px solid var(--border-strong);
  background: var(--surface-2);
  color: var(--text);
  font-size: 13px; font-weight: 600; white-space: nowrap;
  transition: background .12s var(--ease), border-color .12s var(--ease), transform .04s var(--ease);
}
.btn:hover { background: var(--surface-sunk); }
.btn:active { transform: translateY(1px); }
.btn svg { width: 15px; height: 15px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.primary:active { background: var(--accent-press); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--surface-sunk); }
.btn.danger { color: var(--crit); border-color: color-mix(in srgb, var(--crit) 40%, var(--border)); }
.btn.danger:hover { background: var(--crit-tint); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12px; border-radius: var(--radius-sm); }
.btn.lg { height: 40px; padding: 0 18px; font-size: 14px; }
.btn.block { width: 100%; justify-content: center; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.icon { padding: 0; width: 34px; justify-content: center; }
.btn.icon.sm { width: 28px; }

/* --------------------------------- inputs --------------------------------- */
.field { display: flex; flex-direction: column; gap: 6px; }
.label { font-size: 12px; font-weight: 600; color: var(--text-muted); }
.input, .select, .textarea {
  height: 36px; padding: 0 11px;
  background: var(--surface-2);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  color: var(--text); font-size: 13px; width: 100%;
  transition: border-color .12s var(--ease), box-shadow .12s var(--ease);
}
.textarea { height: auto; padding: 9px 11px; resize: vertical; min-height: 72px; line-height: 1.5; }
.input:focus, .select:focus, .textarea:focus {
  outline: none; border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-ring);
}
.input::placeholder, .textarea::placeholder { color: var(--text-subtle); }
.select { appearance: none; cursor: pointer;
  background-image: linear-gradient(45deg, transparent 50%, var(--text-muted) 50%), linear-gradient(135deg, var(--text-muted) 50%, transparent 50%);
  background-position: right 14px center, right 9px center; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
  padding-right: 28px;
}
.input-group { position: relative; display: flex; align-items: center; }
.input-group svg { position: absolute; left: 10px; width: 15px; height: 15px; color: var(--text-subtle); pointer-events: none; }
.input-group .input { padding-left: 32px; }

.check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; font-size: 13px; }
.check input { position: absolute; opacity: 0; width: 0; height: 0; }
.check .box {
  width: 17px; height: 17px; border-radius: 4px; border: 1.5px solid var(--border-strong);
  background: var(--surface-2); display: grid; place-items: center; flex: none; transition: all .12s var(--ease);
}
.check .box svg { width: 12px; height: 12px; color: var(--accent-ink); opacity: 0; transform: scale(.6); transition: all .12s var(--ease); }
.check input:checked + .box { background: var(--accent); border-color: var(--accent); }
.check input:checked + .box svg { opacity: 1; transform: scale(1); }
.check input:focus-visible + .box { box-shadow: 0 0 0 3px var(--accent-ring); }

/* toggle switch */
.switch { position: relative; display: inline-flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
.switch input { position: absolute; opacity: 0; }
.switch .track { width: 38px; height: 22px; border-radius: 999px; background: var(--surface-sunk); border: 1px solid var(--border-strong); transition: all .15s var(--ease); flex: none; }
.switch .track::after { content:""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--text-subtle); transition: all .15s var(--ease); }
.switch input:checked + .track { background: var(--accent); border-color: var(--accent); }
.switch input:checked + .track::after { left: 19px; background: #fff; }
.switch input:focus-visible + .track { box-shadow: 0 0 0 3px var(--accent-ring); }
.switch.danger input:checked + .track { background: var(--crit); border-color: var(--crit); }

/* range */
input[type=range] { -webkit-appearance: none; appearance: none; height: 6px; border-radius: 999px; background: var(--surface-sunk); border: 1px solid var(--border); width: 100%; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); border: 2px solid var(--surface-2); box-shadow: var(--shadow-1); cursor: pointer; }
input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--accent); border: 2px solid var(--surface-2); cursor: pointer; }

/* segmented control */
.seg { display: inline-flex; padding: 3px; gap: 3px; background: var(--surface-sunk); border: 1px solid var(--border); border-radius: var(--radius); }
.seg button { height: 28px; padding: 0 12px; border-radius: var(--radius-sm); font-size: 12px; font-weight: 600; color: var(--text-muted); display: inline-flex; align-items: center; gap: 6px; transition: all .12s var(--ease); }
.seg button svg { width: 14px; height: 14px; }
.seg button.on { background: var(--surface-2); color: var(--text); box-shadow: var(--shadow-1); }
.seg button:not(.on):hover { color: var(--text); }

/* chips (filter terms) */
.chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 6px 0 10px; border-radius: 999px; background: var(--accent-tint); color: var(--accent-press); border: 1px solid var(--accent-tint-2); font-size: 12px; font-weight: 600; }
.chip button { display: grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; color: inherit; opacity: .7; }
.chip button:hover { opacity: 1; background: rgba(0,0,0,.08); }
.chip.flag { background: var(--surface-sunk); color: var(--text-muted); border-color: var(--border); }

/* --------------------------------- status badge --------------------------------- */
.badge { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px; border-radius: 999px; font-size: 11.5px; font-weight: 700; letter-spacing: .01em; white-space: nowrap; }
.badge .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
.badge.new{color:var(--st-new);background:var(--st-new-tint);}
.badge.attempted{color:var(--st-attempted);background:var(--st-attempted-tint);}
.badge.contacted{color:var(--st-contacted);background:var(--st-contacted-tint);}
.badge.interested{color:var(--st-interested);background:var(--st-interested-tint);}
.badge.not_a_fit{color:var(--st-notfit);background:var(--st-notfit-tint);}
.badge.dnc{color:var(--st-dnc);background:var(--st-dnc-tint);}
.badge.tier1{color:var(--accent-press);background:var(--accent-tint);}
.badge.tier2{color:var(--st-new);background:var(--st-new-tint);}
.badge.plain{color:var(--text-muted);background:var(--surface-sunk);}
.badge.good{color:var(--good);background:var(--good-tint);}
.badge.warn{color:var(--warn);background:var(--warn-tint);}
.badge.crit{color:var(--crit);background:var(--crit-tint);}
.badge.info{color:var(--info);background:var(--info-tint);}

/* --------------------------------- cards --------------------------------- */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-1); }

/* --------------------------------- app shell --------------------------------- */
.shell { display: grid; grid-template-columns: var(--sidebar-w) 1fr; height: 100vh; }
.sidebar { background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
.brand { display: flex; align-items: center; gap: 10px; height: var(--topbar-h); padding: 0 16px; border-bottom: 1px solid var(--border); }
.brand .mark { width: 30px; height: 30px; border-radius: 7px; background: var(--accent); display: grid; place-items: center; flex: none; box-shadow: var(--shadow-1); }
.brand .mark svg { width: 18px; height: 18px; color: var(--accent-ink); }
.brand .name { font-weight: 800; letter-spacing: -.01em; font-size: 15px; line-height: 1; }
.brand .sub { font-size: 10px; font-weight: 700; letter-spacing: .13em; color: var(--text-subtle); text-transform: uppercase; margin-top: 3px; }
.nav { padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; flex: 1; }
.nav-label { padding: 12px 10px 5px; }
.nav a { display: flex; align-items: center; gap: 11px; padding: 8px 10px; border-radius: var(--radius); color: var(--text-muted); font-weight: 600; font-size: 13px; transition: background .12s var(--ease), color .12s var(--ease); }
.nav a svg { width: 17px; height: 17px; flex: none; }
.nav a:hover { background: var(--surface-sunk); color: var(--text); }
.nav a.on { background: var(--accent-tint); color: var(--accent-press); }
.nav a .count { margin-left: auto; font-size: 11px; font-weight: 700; color: var(--text-subtle); background: var(--surface-sunk); padding: 1px 7px; border-radius: 999px; }
.nav a.on .count { background: var(--accent-tint-2); color: var(--accent-press); }
.side-foot { border-top: 1px solid var(--border); padding: 10px; }

.usercell { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: var(--radius); width: 100%; }
.usercell:hover { background: var(--surface-sunk); }
.avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #fff; flex: none; }
.usercell .who { text-align: left; min-width: 0; }
.usercell .who .nm { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.usercell .who .rl { font-size: 11px; color: var(--text-subtle); }

/* main column */
.main { display: flex; flex-direction: column; min-width: 0; height: 100vh; }
.topbar { height: var(--topbar-h); border-bottom: 1px solid var(--border); background: color-mix(in srgb, var(--surface) 82%, transparent); backdrop-filter: blur(6px); display: flex; align-items: center; gap: 14px; padding: 0 20px; flex: none; }
.topbar .crumbs { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-muted); min-width: 0; }
.topbar .crumbs .cur { color: var(--text); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .spacer { flex: 1; }
.content { flex: 1; overflow-y: auto; overflow-x: hidden; }
.page { max-width: 1240px; margin: 0 auto; padding: 22px 24px 60px; }
.page.wide { max-width: none; }

.page-head { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 20px; }
.page-head .h1 { font-size: 21px; font-weight: 800; letter-spacing: -.02em; }
.page-head .desc { color: var(--text-muted); font-size: 13px; margin-top: 3px; max-width: 60ch; }
.page-head .spacer { flex: 1; }

/* --------------------------------- tables --------------------------------- */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl thead th { position: sticky; top: 0; z-index: 2; background: var(--surface); text-align: left; font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--text-subtle); padding: 10px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.tbl tbody td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.tbl tbody tr { transition: background .1s var(--ease); }
.tbl tbody tr:hover { background: var(--surface-2); }
.tbl tbody tr:last-child td { border-bottom: none; }
.tbl tbody tr.sel { background: var(--accent-tint); }
.tbl tbody tr.sel:hover { background: var(--accent-tint); }
.tbl tbody tr.dnc { opacity: .62; }
.tbl tbody tr.clickable { cursor: pointer; }
.tbl .co { display: flex; flex-direction: column; gap: 1px; }
.tbl .co .nm { font-weight: 700; }
.tbl .co .meta { font-size: 11.5px; color: var(--text-subtle); }
td.right, th.right { text-align: right; }
.row-flash { animation: flash 1.4s var(--ease); }
@keyframes flash { 0% { background: var(--accent-tint-2); } 100% { background: transparent; } }

/* --------------------------------- tabs --------------------------------- */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); }
.tabs button { padding: 10px 14px; font-size: 13px; font-weight: 600; color: var(--text-muted); border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color .12s var(--ease); }
.tabs button:hover { color: var(--text); }
.tabs button.on { color: var(--accent-press); border-bottom-color: var(--accent); }

/* --------------------------------- map --------------------------------- */
.map { position: relative; background: linear-gradient(160deg, var(--surface-2), var(--surface-sunk)); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
.map svg { width: 100%; height: 100%; display: block; }
.map .tx-land { fill: var(--map-land); stroke: var(--map-line); stroke-width: 1.2; stroke-linejoin: round; }
.map .city-dot { fill: var(--text-subtle); }

const CITIES = [

  { name:"Austin",         lng:-97.74, lat:30.27, major:true },

  { name:"Odessa",         lng:-102.37,lat:31.85, major:false },

  { name:"Laredo",         lng:-99.51, lat:27.51, major:true },

const TX_BOUNDS = { lngMin:-106.75, lngMax:-93.40, latMin:25.70, latMax:36.65 };
const MID_LAT = (TX_BOUNDS.latMin + TX_BOUNDS.latMax) / 2;
const COS_MID = Math.cos(MID_LAT * Math.PI / 180);
const MI_PER_DEG_LAT = 69.0;

/* Build an equirectangular projection fitted to a width×height box. */
function makeProjection(width, height, pad) {
  pad = pad || 14;
  const b = TX_BOUNDS;
  const projW = (b.lngMax - b.lngMin) * COS_MID;
  const projH = (b.latMax - b.latMin);
  const scale = Math.min((width - 2 * pad) / projW, (height - 2 * pad) / projH);
  const offX = (width - projW * scale) / 2;
  const offY = (height - projH * scale) / 2;
  function project(lng, lat) {
    const x = offX + (lng - b.lngMin) * COS_MID * scale;
    const y = offY + (b.latMax - lat) * scale;
    return [x, y];
  }
  return {
    project,
    scale,
    milesToPx: (mi) => (mi / MI_PER_DEG_LAT) * scale,
    pathFor: (pts) => pts.map((p, i) => (i ? "L" : "M") + project(p[0], p[1]).map(n => n.toFixed(1)).join(" ")).join(" ") + "Z"
  };

/* Haversine great-circle distance in miles. */
function haversineMiles(lng1, lat1, lng2, lat2) {
  const R = 3958.8, toRad = Math.PI / 180;
  const dLat = (lat2 - lat1) * toRad, dLng = (lng2 - lng1) * toRad;
  const a = Math.sin(dLat / 2) ** 2 +
            Math.cos(lat1 * toRad) * Math.cos(lat2 * toRad) * Math.sin(dLng / 2) ** 2;
  return R * 2 * Math.asin(Math.sqrt(a));
}

/* Local flat-plane miles (fast, accurate over TX-scale spans) for corridor math. */
function toPlane(lng, lat) {
  return [ lng * COS_MID * MI_PER_DEG_LAT, lat * MI_PER_DEG_LAT ];
}
function pointToSegMiles(plng, plat, alng, alat, blng, blat) {
  const p = toPlane(plng, plat), a = toPlane(alng, alat), b = toPlane(blng, blat);
  const abx = b[0]-a[0], aby = b[1]-a[1];
  const apx = p[0]-a[0], apy = p[1]-a[1];
  const len2 = abx*abx + aby*aby || 1e-9;
  let t = (apx*abx + apy*aby) / len2;
  t = Math.max(0, Math.min(1, t));
  const cx = a[0] + t*abx, cy = a[1] + t*aby;
  return Math.hypot(p[0]-cx, p[1]-cy);
}
/* Distance from a point to a polyline (route), in miles. */
function pointToRouteMiles(lng, lat, route) {
  let min = Infinity;
  for (let i = 0; i < route.length - 1; i++) {
    const d = pointToSegMiles(lng, lat, route[i].lng, route[i].lat, route[i+1].lng, route[i+1].lat);
    if (d < min) min = d;
  }
  return min;
}
/* ============================================================================
   data.js — seeded, deterministic mock dataset (stable across reloads).
   Mirrors the future Supabase schema (see mockup/README.md). Nothing here is

   ============================================================================ */

const NOW_MS = Date.parse("2026-07-15T15:00:00Z");
const DAY = 86400000, HOUR = 3600000;

/* mulberry32 — tiny seeded PRNG so the demo data never shifts under you. */
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };

const pick = (arr) => arr[Math.floor(rng() * arr.length)];
const chance = (p) => rng() < p;

const GEO = ["Lone Star","Brazos","Permian","Hill Country","Trinity","Bluebonnet","Caprock",

const SG_CORE = ["Aggregate","Sand & Gravel","Rock","Materials","Dirt Works","Gravel","Aggregates",

const T2_CORE = ["Construction","Dump Truck","Excavation","Ready Mix","Concrete","Building Supply","Site Works"];
const T0_CORE = ["Logistics","Refrigerated","Tank Lines","Livestock","Van Lines","Distribution","Freightways"];
const SUFFIX = ["Trucking","Transport","Hauling","Logistics","Carriers","Express","LLC","Inc."];
const SG_OTHER = ["Sand and Gravel","Sand & Gravel","SAND/GRAVEL","Rock & Dirt","Aggregate Hauling","Gravel",
  "Sand, Gravel, Rock","Dirt & Aggregate","Crushed Stone","Fill Dirt / Sand","Sand and gravel hauling",
  "S&G Hauling","Rock, Sand, Base","aggregate / dirt"];
const STREETS = ["Farm to Market Rd","County Rd","Industrial Blvd","Quarry Rd","Old Bastrop Hwy","Pit Rd",
  "Commerce St","Aggregate Way","Loop","Business Park Dr","Ranch Rd","Highway 90"];
const AREA_BY_CITY = { "Houston":"713","San Antonio":"210","Austin":"512","Dallas":"214","Fort Worth":"817",
  "El Paso":"915","Midland":"432","Odessa":"432","Lubbock":"806","Laredo":"956","Corpus Christi":"361",

function makeCarrier(i) {
  const r = rng();
  const tier = r < 0.60 ? 1 : (r < 0.90 ? 2 : 0);

    flags = ["Commodities Dry Bulk"];

    legal = geo + " " + pick(T0_CORE) + " " + pick(SUFFIX);

    dot: 1200000 + i * 137 + rndInt(0, 130),
    legal_name: legal,
    dba: chance(0.25) ? geo + " " + pick(["S&G","Aggregates","Hauling","Materials"]) : null,

/* ---- search matching (single source: drives builder live-count AND batch snapshots) ---- */
function carrierMatchesSearch(c, s) {
  // cargo
  if (s.cargo) {
    const okTier = c.tier === 1 || (s.cargo.wideNet && c.tier === 2);
    if (!okTier) return false;
  }
  // geo
  if (s.geo) {
    if (s.geo.mode === "radius") {
      if (haversineMiles(c.lng, c.lat, s.geo.anchorLng, s.geo.anchorLat) > s.geo.radiusMi) return false;
    } else if (s.geo.mode === "corridor") {
      if (pointToRouteMiles(c.lng, c.lat, s.geo.route) > s.geo.bufferMi) return false;
    }
  }
  if (s.forHire && c.classdef !== "Authorized For Hire") return false;
  if (s.activeOnly && !c.active) return false;
  if (s.authorizedOnly && c.ins.authority_status !== "active") return false;
  if (s.interstateOnly && c.operation !== "Interstate") return false;
  if (s.sizeMin != null && c.power_units < s.sizeMin) return false;
  if (s.sizeMax != null && c.power_units > s.sizeMax) return false;
  if (s.excludeSafety && c.safety.concerning) return false;
  if (s.insuranceMin && !s.keepBelow && c.ins.bipd_on_file < s.insuranceMin) return false;
  return true;
}
function searchMatches(s) { return carriers.filter(c => carrierMatchesSearch(c, s)); }

    snapshot_at: bd.snapshot_at, last_refreshed: bd.last_refreshed,

    new_since: bi === 2 ? 6 : (bi === 0 ? 3 : 0)   // pretend a refresh would add these

    if (bi === 0 && idx < 22) status = pick(["attempted","contacted","interested","contacted","not_a_fit"]);

/* ------------------------------- helpers ------------------------------- */
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m])); }
function cur() { return state.session ? DB.userById[state.session.userId] : null; }
function fmtRel(ms) {
  const d = NOW_MS - ms;
  if (d < 0) { const f = -d; if (f < HOUR) return "in " + Math.max(1, Math.round(f/60000)) + "m"; if (f < DAY) return "in " + Math.round(f/HOUR) + "h"; return "in " + Math.round(f/DAY) + "d"; }
  if (d < 60000) return "just now";
  if (d < HOUR) return Math.round(d/60000) + "m ago";
  if (d < DAY) return Math.round(d/HOUR) + "h ago";
  if (d < 2*DAY) return "yesterday";
  if (d < 7*DAY) return Math.round(d/DAY) + "d ago";
  const dt = new Date(ms), mo = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return mo[dt.getUTCMonth()] + " " + dt.getUTCDate();
}
function fmtMoney(n) { if (!n) return "None"; if (n >= 1e6) return "$" + (n/1e6).toFixed(n % 1e6 ? 1 : 0) + "M"; if (n >= 1e3) return "$" + Math.round(n/1e3) + "K"; return "$" + n; }
const STATUS = {
  new:{label:"New",cls:"new"}, attempted:{label:"Attempted",cls:"attempted"}, contacted:{label:"Contacted",cls:"contacted"},
  interested:{label:"Interested",cls:"interested"}, not_a_fit:{label:"Not a Fit",cls:"not_a_fit"}, dnc:{label:"Do Not Call",cls:"dnc"}
};
const STATUS_ORDER = ["new","attempted","contacted","interested","not_a_fit"];
const DISPO_LABEL = { no_answer:"No answer", voicemail:"Voicemail", connected:"Connected", callback:"Callback", not_interested:"Not interested", wrong_number:"Wrong number", interested:"Interested" };
const ROLE_LABEL = { manager:"Manager", edit:"Editor", view:"Viewer", guest:"Guest" };
function badge(status) { const m = STATUS[status] || STATUS.new; return '<span class="badge ' + m.cls + '"><span class="dot"></span>' + m.label + "</span>"; }
function avatar(u, size) { const s = size || 30; return '<span class="avatar" style="width:'+s+'px;height:'+s+'px;background:'+u.color+';font-size:'+(s*0.4)+'px">' + initials(u.name) + "</span>"; }
function initials(n) { return n.split(/\s+/).slice(0,2).map(w => w[0]).join("").toUpperCase(); }

/* effective (override-aware) accessors */
function effDnc(dot) { return (dot in state.overrides.dnc) ? state.overrides.dnc[dot] : DB.carrierByDot[dot].do_not_contact; }
function effStatus(batchId, dot) { const k = batchId + ":" + dot; if (k in state.overrides.status) return state.overrides.status[k]; const bc = DB.batchCarriers.find(b => b.batch_id === batchId && b.dot === dot); return bc ? bc.status : "new"; }
function batchMembers(batchId) { return DB.batchCarriers.filter(b => b.batch_id === batchId); }
function batchesForDot(dot) { return DB.batchCarriers.filter(b => b.dot === dot).map(b => b.batch_id); }
function logsForDot(dot) {
  const seed = DB.callLogs.filter(l => l.dot === dot);
  const added = state.overrides.logs.filter(l => l.dot === dot);
  return seed.concat(added).sort((a, b) => b.at - a.at);
}
function statusCounts(batchId) {
  const c = { new:0, attempted:0, contacted:0, interested:0, not_a_fit:0, dnc:0 };
  batchMembers(batchId).forEach(b => { if (effDnc(b.dot)) c.dnc++; else c[effStatus(batchId, b.dot)]++; });
  return c;
}

let toastSeq = 0;
function toast(msg, ic) {
  const id = toastSeq++;
  state.toasts.push({ id, msg, ic: ic || "check" });
  render();
  setTimeout(() => { state.toasts = state.toasts.filter(t => t.id !== id); render(); }, 2600);
}
function openModal(m) { state.menu = null; state.modal = m; render(); }
function closeModal() { state.modal = null; render(); }
function openMenu(m) { state.menu = m; render(); }
function closeMenu() { if (state.menu) { state.menu = null; render(); } }

/* ------------------------------- render ------------------------------- */
const ACT = {};   // action handlers, populated across files

function applyTheme() {
  const root = document.documentElement;
  if (state.theme) root.setAttribute("data-theme", state.theme);
  else root.removeAttribute("data-theme");
}
function render() {
  const root = document.getElementById("app");
  applyTheme();
  let html = (typeof SCREENS !== "undefined" && SCREENS[state.screen]) ? SCREENS[state.screen]() : '<div class="empty">…</div>';
  html += overlays();
  root.innerHTML = html;
  if (state.focus) { const f = root.querySelector(state.focus); if (f) f.focus(); state.focus = null; }
}
function overlays() {
  let h = "";
  if (state.modal && typeof MODALS !== "undefined" && MODALS[state.modal.type]) h += MODALS[state.modal.type](state.modal);
  if (state.menu && typeof MENUS !== "undefined" && MENUS[state.menu.type]) {
    h += '<div class="menu" style="left:' + state.menu.x + 'px;top:' + state.menu.y + 'px">' + MENUS[state.menu.type](state.menu) + "</div>";
  }
  if (state.toasts.length) {
    h += '<div class="toast-wrap">' + state.toasts.map(t => '<div class="toast">' + icon(t.ic) + esc(t.msg) + "</div>").join("") + "</div>";
  }
  return h;
}

  root.addEventListener("change", onChange);
  root.addEventListener("submit", onSubmit);
  root.addEventListener("keydown", onKeydown);
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { if (state.menu) closeMenu(); else if (state.modal) closeModal(); }
  });
}
function onClick(e) {
  const t = e.target.closest("[data-act]");
  const inMenu = e.target.closest(".menu");
  if (state.menu && !inMenu && !(t && t.dataset.act === state.menu.type)) closeMenu();
  if (!t) return;
  const act = t.dataset.act;
  // Don't open a row when the click landed on an in-row control (checkbox, status select, buttons).
  if (act === "openCarrier" && e.target.closest("select, input, button, label")) return;
  // Backdrop click closes the modal; clicks inside the modal body do not.
  if (act === "closeModal" && t.classList.contains("scrim") && e.target.closest(".modal")) return;
  if (ACT[act]) { e.preventDefault(); ACT[act]({ ...t.dataset }, e, t); }
}
function onKeydown(e) {
  const t = e.target;
  if (e.key === "Enter" && t.dataset && t.dataset.keyadd) {
    e.preventDefault();
    if (ACT[t.dataset.keyadd]) ACT[t.dataset.keyadd]({ v: t.value });
  }
}
function onChange(e) {
  const t = e.target;
  if (t.dataset && t.dataset.change && ACT[t.dataset.change]) {
    ACT[t.dataset.change]({ ...t.dataset, value: t.type === "checkbox" ? t.checked : t.value }, e, t);
  }
}
function onInput(e) {
  const t = e.target;
  if (!t.dataset) return;
  if (t.dataset.echo) { const el = document.getElementById(t.dataset.echo); if (el) el.textContent = t.dataset.echoFmt === "mi" ? t.value + " mi" : t.value; }
  if (t.dataset.live && ACT[t.dataset.live]) ACT[t.dataset.live]({ ...t.dataset, value: t.value }, e, t);
  if (t.dataset.model) { setModel(t.dataset.model, t.value); }
}
function onSubmit(e) { const t = e.target.closest("[data-submit]"); if (t) { e.preventDefault(); if (ACT[t.dataset.submit]) ACT[t.dataset.submit]({ ...t.dataset }, e, t); } }
function setModel(path, val) { const parts = path.split("."); let o = state; for (let i = 0; i < parts.length - 1; i++) o = o[parts[i]]; o[parts[parts.length - 1]] = val; }

const PRESET_ROUTES = {
  aus_sat: { label:"Austin → San Antonio", route:[{lng:-97.74,lat:30.27},{lng:-98.10,lat:29.89},{lng:-98.49,lat:29.42}] },
  dal_ftw: { label:"Dallas → Fort Worth",  route:[{lng:-96.80,lat:32.78},{lng:-97.05,lat:32.76},{lng:-97.33,lat:32.75}] },
  hou_cc:  { label:"Houston → Corpus Christi", route:[{lng:-95.37,lat:29.76},{lng:-96.40,lat:28.98},{lng:-97.40,lat:27.80}] },
  mid_od:  { label:"Midland → Odessa",     route:[{lng:-102.08,lat:32.00},{lng:-102.37,lat:31.85}] }
};
function statusVar(s) { return "var(--st-" + ({ not_a_fit:"notfit" }[s] || s) + ")"; }

function mapCore(pins, geo) {
  const W = 640, H = 520, proj = makeProjection(W, H, 16);
  const land = proj.pathFor(TX_OUTLINE);
  const anchorMark = (x, y) => '<circle class="anchor" cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="5"/>';
  let overlay = "";
  if (geo && geo.mode === "radius") {
    const p = proj.project(geo.anchorLng, geo.anchorLat), r = proj.milesToPx(geo.radiusMi);
    overlay = '<circle class="radius-fill" cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="' + r.toFixed(1) + '"/>' + anchorMark(p[0], p[1]);
  } else if (geo && geo.mode === "corridor") {
    const pts = geo.route.map(q => proj.project(q.lng, q.lat));
    const d = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
    const bw = proj.milesToPx(geo.bufferMi) * 2;
    overlay = '<path class="corridor-band" style="stroke-width:' + bw.toFixed(1) + 'px" d="' + d + '"/>' +
              '<path class="corridor-line" d="' + d + '"/>' + pts.map(p => anchorMark(p[0], p[1])).join("");
  }
  const cityDots = CITIES.filter(c => c.major).map(c => {
    const p = proj.project(c.lng, c.lat);
    return '<circle class="city-dot" cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="2"/>' +
           '<text class="city-lbl" x="' + (p[0]+5).toFixed(1) + '" y="' + (p[1]+3).toFixed(1) + '">' + esc(c.name) + "</text>";
  }).join("");
  const pinEls = pins.map(p => {
    const q = proj.project(p.lng, p.lat);
    const style = p.fill ? ' style="fill:' + p.fill + '"' : "";
    const inter = p.dot ? ' data-act="openCarrier" data-dot="' + p.dot + '" data-from="' + (p.from || "") + '" style="cursor:pointer' + (p.fill ? ";fill:" + p.fill : "") + '"' : style;
    return '<circle class="pin ' + (p.cls || "") + '" cx="' + q[0].toFixed(1) + '" cy="' + q[1].toFixed(1) + '" r="' + (p.r || 4) + '"' + inter + "><title>" + esc(p.title || "") + "</title></circle>";
  }).join("");
  return '<svg viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="xMidYMid meet">' +
    '<path class="tx-land" d="' + land + '"/>' + cityDots + overlay + pinEls + "</svg>";
}

/* ------------------------------- WORKING LIST ------------------------------- */
function distanceFor(c, geo) {
  if (!geo) return null;
  return geo.mode === "radius" ? haversineMiles(c.lng, c.lat, geo.anchorLng, geo.anchorLat) : pointToRouteMiles(c.lng, c.lat, geo.route);
}
function workingRows(batchId) {
  const b = DB.batches.find(x => x.id === batchId), geo = b.search.geo, f = state.list;
  let rows = batchMembers(batchId).map(m => {
    const c = DB.carrierByDot[m.dot];
    return { c, dnc: effDnc(m.dot), status: effStatus(batchId, m.dot), dist: distanceFor(c, geo), logs: logsForDot(m.dot) };
  });
  if (f.status !== "all") rows = rows.filter(r => f.status === "dnc" ? r.dnc : (!r.dnc && r.status === f.status));
  if (f.q) { const q = f.q.toLowerCase(); rows = rows.filter(r => r.c.legal_name.toLowerCase().includes(q) || String(r.c.dot).includes(q) || r.c.city.toLowerCase().includes(q)); }
  if (f.insurance !== "any") { const min = +f.insurance; rows = rows.filter(r => r.c.ins.bipd_on_file >= min); }
  if (f.size !== "any") { const [lo, hi] = SIZE_RANGES[f.size]; rows = rows.filter(r => (lo == null || r.c.power_units >= lo) && (hi == null || r.c.power_units <= hi)); }
  rows.sort((a, z) => f.sort === "distance" ? (a.dist||0) - (z.dist||0) : f.sort === "size" ? z.c.power_units - a.c.power_units :
    f.sort === "recent" ? (z.logs[0]?.at||0) - (a.logs[0]?.at||0) : a.c.legal_name.localeCompare(z.c.legal_name));
  return rows;
}

function workingMap(b, rows) {

  const b = state.builder, s = builderSearch(b), matches = searchMatches(s), mset = new Set(matches);
  const map = document.getElementById("b-map");
  if (map) map.innerHTML = mapCore(builderPins(s, mset), s.geo) + mapCount(matches.length) + mapLegend(true);
  const prev = document.getElementById("b-preview");
  if (prev) prev.innerHTML = builderPreview(matches);
  const fc = document.getElementById("b-foot-count");
  if (fc) fc.textContent = matches.length;
}

  const b = DB.batches.find(x => x.id === state.activeBatchId);

  const i = DB.batches.findIndex(x => x.id === d.id); if (i >= 0) DB.batches.splice(i, 1);
  for (let k = DB.batchCarriers.length - 1; k >= 0; k--) if (DB.batchCarriers[k].batch_id === d.id) DB.batchCarriers.splice(k, 1);
  state.screen = "dashboard"; closeModal(); toast("Batch deleted");
};
ACT.refreshBatch = (d) => {
  const b = DB.batches.find(x => x.id === d.id); if (!b) return;
  const have = new Set(batchMembers(b.id).map(m => m.dot));
  const fresh = searchMatches(b.search).filter(c => !have.has(c.dot)).slice(0, b.new_since || 0);
  fresh.forEach(c => DB.batchCarriers.push({ id: "bc_" + (bcSeq++), batch_id: b.id, dot: c.dot, status: "new", status_by: null, status_at: NOW_MS, added_at: NOW_MS, via_refresh: true, onboarded_at: null }));
  b.new_since = 0; b.last_refreshed = NOW_MS; state.menu = null;
  openModal({ type: "refresh", added: fresh.length });
};
ACT.grabBatch = () => {
  const b = state.builder, s = builderSearch(b), matches = searchMatches(s);
  const name = (b.name || "").trim() || (b.geoMode === "radius" ? b.anchorCity + " Aggregates" : PRESET_ROUTES[b.routeKey].label);
  const id = "b_u" + (newBatchSeq++);
  DB.batches.push({ id, name, desc: "Created just now.", created_by: state.session.userId, snapshot_at: NOW_MS, last_refreshed: NOW_MS, search: s, snapshot_count: matches.length, new_since: 0 });
  matches.forEach(c => DB.batchCarriers.push({ id: "bc_" + (bcSeq++), batch_id: id, dot: c.dot, status: "new", status_by: null, status_at: NOW_MS, added_at: NOW_MS, via_refresh: false, onboarded_at: null }));
  state.activeBatchId = id; state.selection = {};
  state.list = { status: "all", q: "", view: "list", insurance: "any", size: "any", sort: "name" };
  state.screen = "workingList"; toast('Grabbed ' + matches.length + ' carriers into "' + name + '"', "layers");
};

ACT.listSize = (d) => { state.list.size = d.value; render(); };
ACT.listSort = (d) => { state.list.sort = d.value; render(); };
ACT.selRow = (d) => { state.selection[d.dot] = d.value; render(); };
ACT.selAll = (d) => {
  const b = DB.batches.find(x => x.id === state.activeBatchId);
  workingRows(b.id).filter(r => !r.dnc).forEach(r => state.selection[r.c.dot] = d.value);
  render();
};
ACT.clearSel = () => { state.selection = {}; render(); };
ACT.bulkStatus = (d) => {
  const dots = Object.keys(state.selection).filter(k => state.selection[k]);
  dots.forEach(dot => { if (!effDnc(dot)) state.overrides.status[state.activeBatchId + ":" + dot] = d.s; });
  state.selection = {}; toast(dots.length + " carriers → " + STATUS[d.s].label);
};
ACT.genContact = () => {
  const dots = Object.keys(state.selection).filter(k => state.selection[k] && !effDnc(k));
  if (!dots.length) { toast("No contactable carriers selected", "alert"); return; }
  openModal({ type: "contact", dots });
};
ACT.rowStatus = (d) => {
  if (d.value === "dnc") { openModal({ type: "dnc", dot: d.dot }); return; }
  state.overrides.status[d.batch + ":" + d.dot] = d.value; toast('Status → ' + STATUS[d.value].label);
};

/* ---- carrier profile ---- */
ACT.openCarrier = (d) => { state.activeCarrierDot = +d.dot; state.profileFromBatch = d.from || null; state.profileTab = "overview"; state.screen = "profile"; state.menu = null; render(); };
ACT.openBatchCarrier = (d) => { state.profileFromBatch = d.batch; state.activeCarrierDot = +d.dot; state.profileTab = "overview"; state.screen = "profile"; render(); };
ACT.profileTab = (d) => { state.profileTab = d.t; render(); };
ACT.toggleDnc = (d) => { if (effDnc(d.dot)) openModal({ type: "undnc", dot: d.dot }); else openModal({ type: "dnc", dot: d.dot }); };
ACT.confirmDnc = (d) => { state.overrides.dnc[d.dot] = true; closeModal(); toast("Do Not Call set — suppressed in every batch", "lock"); };
ACT.confirmUndnc = (d) => { state.overrides.dnc[d.dot] = false; closeModal(); toast("Do Not Call cleared"); };
ACT.sendOnboard = (d) => openModal({ type: "onboard", dot: d.dot });
ACT.confirmOnboard = (d) => { state.overrides.onboarded[d.dot] = NOW_MS; closeModal(); toast("Sent USDOT " + d.dot + " to onboarding", "arrowR"); };
ACT.logCall = (d) => openModal({ type: "log", dot: d.dot, batch: d.batch || null });
function saveLog() {
  const m = state.modal, dispo = val("log-dispo"), notes = val("log-notes"), next = val("log-next");
  const statusEl = document.getElementById("log-status");
  state.overrides.logs.push({ id: "cl_" + (clSeq++), dot: +m.dot, batch_id: m.batch || null, user_id: state.session.userId, at: NOW_MS, disposition: dispo, notes, next_steps: next, callback_at: dispo === "callback" ? NOW_MS + DAY : null });
  if (m.batch && statusEl && statusEl.value) state.overrides.status[m.batch + ":" + m.dot] = statusEl.value;
  closeModal(); toast("Call logged", "phone");
}
ACT.submitLog = () => saveLog();
ACT.submitLogBtn = () => saveLog();
function val(id) { const el = document.getElementById(id); return el ? el.value : ""; }

/* ---- users admin ---- */
ACT.approveUser = (d) => openModal({ type: "approve", uid: d.uid });
ACT.confirmApprove = (d) => {
  const r = document.querySelector('input[name=approle]:checked');
  const role = r ? r.value : "edit";
  state.overrides.userStatus[d.uid] = { status: "approved", role };
  closeModal(); toast(DB.userById[d.uid].name.split(" ")[0] + " approved as " + ROLE_LABEL[role], "usercheck");
};
ACT.rejectUser = (d) => { state.overrides.userStatus[d.uid] = { status: "suspended", role: "guest" }; toast("Account rejected"); };
ACT.setRole = (d) => {
  const u = DB.userById[d.uid], cur = state.overrides.userStatus[d.uid];
  const status = cur ? cur.status : u.status;
  state.overrides.userStatus[d.uid] = { status: status === "pending" ? "approved" : status, role: d.value };
  toast("Role updated to " + ROLE_LABEL[d.value]);
};
ACT.suspendUser = (d) => {
  const u = DB.userById[d.uid], cur = state.overrides.userStatus[d.uid];
  const status = cur ? cur.status : u.status, role = cur ? cur.role : u.role;
  state.overrides.userStatus[d.uid] = { status: status === "suspended" ? "approved" : "suspended", role };
  render();
};

/* ---- generic ---- */
ACT.toast = (d) => toast(d.msg, d.ic);
ACT.userMenu = (d, e, t) => { const r = t.getBoundingClientRect(); openMenu({ type: "userMenu", x: r.left, y: Math.max(10, r.top - 112) }); };

/* ---- boot ---- */
window.ACT = ACT;
mount();
render();
</script>
